<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C3E63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SmashStats">
<title>SmashStats</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ---- theme variables ---- */
:root{
  --navy:#0C3E63; --navy-dark:#0F1E36; --gold:#FABE0F; --rose:#C2486B;
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-muted:#E9EEF1; --text:#16222B;
  --muted:#5B6B76; --border:#D3DCE1; --accent:#0C3E63; --danger:#B3261E;
  --win:#1B7A3D; --loss:#B3261E; --tabbar-h:64px;
}
[data-theme="mint_pale"]{
  --navy:#2F6B5E; --navy-dark:#234F46; --gold:#E8B64C; --rose:#C2486B;
  --bg:#EFF7F3; --surface:#FFFFFF; --surface-muted:#DCEDE6; --text:#1C2B27;
  --muted:#5A7268; --border:#C4D8CE; --accent:#2F6B5E; --danger:#B3261E;
  --win:#1B7A3D; --loss:#B3261E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  padding-top:env(safe-area-inset-top);
}
#app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg);
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);}
body.kb #tabbar{display:none;}
body.kb #app{padding-bottom:12px;}
header{
  position:sticky; top:0; z-index:20;
  background:var(--navy); color:#fff;
  padding:10px 14px calc(10px + env(safe-area-inset-top)*0);
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:10px;
}
header h1{font-size:19px; margin:0; letter-spacing:.5px; white-space:nowrap;}
header h1 .gold{color:var(--gold);}
header .spacer{flex:1;}
header select{
  max-width:150px; font-size:15px; padding:8px 6px; border-radius:8px;
  border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.12); color:#fff;
}
header select option{color:#16222B;}
.icon-btn{
  min-width:44px; min-height:44px; border-radius:10px; border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.12); color:#fff; font-size:20px; cursor:pointer;
}
#install-banner{
  display:none; margin:10px 12px 0; padding:12px; border-radius:12px;
  background:#FFF7D6; border:1px solid var(--gold); color:#5A4300; font-size:14px;
}
#install-banner.show{display:block;}
#install-banner button{margin-top:8px;}
main{padding:12px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-bottom:12px;
}
.card h2{font-size:17px; margin:0 0 8px;}
.card h3{font-size:15px; margin:14px 0 6px;}
.muted{color:var(--muted); font-size:14px;}
.small{font-size:13px;}
.badge{
  display:inline-block; padding:2px 9px; border-radius:999px; font-size:13px; font-weight:700;
  white-space:nowrap; flex-shrink:0;
}
.badge.win{background:#DDF2E3; color:var(--win);}
.badge.loss{background:#FBE3E1; color:var(--loss);}
.badge.draw{background:#E9EEF1; color:var(--muted);}
.badge.pro{background:var(--gold); color:#4A3600;}
.badge.free{background:var(--surface-muted); color:var(--muted);}
.badge.demo{background:#F3D9E2; color:var(--rose);}
.badge.sync{background:#E3ECF5; color:var(--navy);}
button, .btn{
  font-size:16px; min-height:48px; padding:10px 16px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  cursor:pointer; font-family:inherit;
}
button.primary, .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
button.danger{background:#fff; border-color:var(--danger); color:var(--danger);}
button.gold{background:var(--gold); border-color:var(--gold); color:#4A3600; font-weight:700;}
button:disabled{opacity:.45; cursor:default;}
button.block{width:100%;}
label{display:block; font-size:14px; font-weight:700; margin:12px 0 4px;}
input, select, textarea{
  width:100%; font-size:16px; padding:11px 10px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  font-family:inherit;
}
input[type="date"]{min-height:48px;}
textarea{min-height:76px; resize:vertical;}
.row{display:flex; gap:8px; align-items:center;}
.row>*{flex:1;}
.row .narrow{flex:0 0 auto;}
.set-row{
  border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:10px;
  background:var(--surface-muted);
}
.set-row .set-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.set-row .set-head b{font-size:15px;}
.match-card{cursor:pointer;}
.match-card .top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.match-card .opp{font-size:17px; font-weight:700;}
.match-card .score{font-size:17px; font-weight:700; white-space:nowrap;}
.match-card .sub{font-size:14px; color:var(--muted); margin-top:4px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center;}
.stat-grid .stat{background:var(--surface-muted); border-radius:12px; padding:10px 4px;}
.stat-grid .num{font-size:22px; font-weight:800;}
.stat-grid .lbl{font-size:12px; color:var(--muted);}
.bar-row{display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0;}
.bar-row .bar-label{flex:0 0 92px;}
.bar-row .bar-track{flex:1; height:10px; background:var(--surface-muted); border-radius:6px; overflow:hidden;}
.bar-row .bar-fill{height:100%; background:var(--accent);}
.bar-row .bar-val{flex:0 0 52px; text-align:right;}
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar .tabs{max-width:480px; margin:0 auto; display:flex;}
#tabbar button{
  flex:1; border:none; background:none; border-radius:0; min-height:var(--tabbar-h);
  padding:6px 0 8px; font-size:12px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
#tabbar button .ic{font-size:22px; line-height:1;}
#tabbar button.active{color:var(--accent); font-weight:700;}
#tabbar button.active .ic{color:var(--accent);}
#overlay{
  display:none; position:fixed; inset:0; z-index:50; background:rgba(10,25,35,.55);
  align-items:flex-end; justify-content:center;
}
#overlay.show{display:flex;}
#overlay .sheet{
  width:100%; max-width:480px; max-height:86vh; overflow:auto;
  background:var(--surface); border-radius:18px 18px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
}
#overlay .sheet h2{margin-top:0;}
.point-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0;}
.point-btns button{min-height:72px; font-size:20px; font-weight:800;}
.score-big{font-size:34px; font-weight:800; text-align:center; margin:8px 0;}
.notice{
  border-radius:12px; padding:12px; margin-bottom:12px; font-size:15px;
  background:#FFF7D6; border:1px solid var(--gold);
}
.notice.info{background:#E3ECF5; border-color:#9DB8D2;}
.notice.error{background:#FBE3E1; border-color:#E0A49F;}
.empty{padding:22px 10px; text-align:center; color:var(--muted);}
.divider{height:1px; background:var(--border); margin:14px 0;}
.kv{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--surface-muted); font-size:15px;}
.kv:last-child{border-bottom:none;}
.kv span{text-wrap:balance;}
.kv b{text-align:right; text-wrap:balance;}
.tabs-inline{display:flex; gap:8px; margin-bottom:12px;}
.tabs-inline button{flex:1; min-height:44px; font-size:15px;}
.tabs-inline button.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}
@media (max-width:360px){ header h1{font-size:17px;} }
/* Phase 3: score sheet */
.sheet-table{width:100%;border-collapse:collapse;font-size:15px}
.sheet-table th,.sheet-table td{border:1px solid var(--border);padding:8px;text-align:center}
.sheet-table td:first-child{font-weight:700}
.small{font-size:12px}
@media print{
  body{background:#fff}
  header, #tabbar, #install-banner, .no-print{display:none !important}
  #overlay{position:static;background:#fff;display:block !important}
  #overlay .sheet{max-height:none;border-radius:0;box-shadow:none;padding:0}
  .sheet-table th,.sheet-table td{border-color:#999}
}
</style>
</head>
<body data-theme="standard">
<div id="app">
  <header>
    <h1>Smash<span class="gold">Stats</span></h1>
    <div class="spacer"></div>
    <select id="player-select" aria-label="選手切替"></select>
    <button class="icon-btn" id="btn-settings" aria-label="設定">⚙️</button>
  </header>
  <div id="install-banner"></div>
  <main id="view"></main>
  <nav id="tabbar" aria-label="タブ">
    <div class="tabs">
      <button data-tab="home"><span class="ic">🏠</span><span data-i18n="tab_home">ホーム</span></button>
      <button data-tab="matches"><span class="ic">🎾</span><span data-i18n="tab_matches">試合</span></button>
      <button data-tab="register"><span class="ic">✏️</span><span data-i18n="tab_register">登録</span></button>
      <button data-tab="analytics"><span class="ic">📊</span><span data-i18n="tab_analytics">分析</span></button>
      <button data-tab="gear"><span class="ic">🏸</span><span data-i18n="tab_gear">用具</span></button>
    </div>
  </nav>
</div>
<div id="overlay"><div class="sheet" id="overlay-sheet"></div></div>

/* =====================================================================
   競技別スコア計算（純粋関数。UI・勝敗判定・分析の共通ロジック）
   ScoreSheetModels.kt の calculateGameProgress 相当を移植。
   ===================================================================== */
function rallyTarget(sport){
  if (sport==='BADMINTON') return 21;
  if (sport==='TABLE_TENNIS' || sport==='PICKLEBALL') return 11;
  return 21;
}
function isRallySport(sport){ return sport==='BADMINTON'||sport==='TABLE_TENNIS'||sport==='PICKLEBALL'; }

/* 1ゲーム分のポイント列 ["A","B",...] から進行状態を計算する */
function calcGameProgress(sport, initialServer, points){
  let a=0, b=0, server=initialServer||'A';
  let gamesA=0, gamesB=0, rallyA=0, rallyB=0;
  let tieA=null, tieB=null, isTiebreak=false, gameOver=false;
  const tennis = (sport==='TENNIS' || sport==='SOFT_TENNIS');
  const target = rallyTarget(sport);
  const cap = sport==='BADMINTON' ? 30 : null;

  function rallyDone(x, y){
    if (cap!=null && (x===cap || y===cap)) return true;
    return (x>=target && (x-y)>=2) || (y>=target && (y-x)>=2);
  }
  for (const w of points){
    if (gameOver) break;
    if (tennis){
      const tb = (sport==='TENNIS' && gamesA===6 && gamesB===6) ||
                 (sport==='SOFT_TENNIS' && gamesA===3 && gamesB===3);
      isTiebreak = tb;
      if (w==='A') rallyA++; else rallyB++;
      if (tb){
        tieA=rallyA; tieB=rallyB;
        if ((rallyA>=7 && rallyA-rallyB>=2) || (rallyB>=7 && rallyB-rallyA>=2)){
          if (rallyA>rallyB) gamesA++; else gamesB++;
          rallyA=0; rallyB=0; gameOver=true;
        }
      } else {
        if ((rallyA>=4 && rallyA-rallyB>=2) || (rallyB>=4 && rallyB-rallyA>=2)){
          if (rallyA>rallyB) gamesA++; else gamesB++;
          rallyA=0; rallyB=0; server = (server==='A')?'B':'A';
        }
      }
    } else {
      if (w==='A') a++; else b++;
      if (w!==server) server = w; // ラリー競技: レシーバーが取ればサーブ権が移る（簡易）
      if (rallyDone(a,b)) gameOver=true;
    }
  }
  const rallyLabel = tennis ? tennisPointLabel(rallyA, rallyB) : null;
  return {
    scoreA: tennis?gamesA:a, scoreB: tennis?gamesB:b,
    rallyDisplayA: tennis?rallyLabel.a:String(a), rallyDisplayB: tennis?rallyLabel.b:String(b),
    currentServer: server, isGameOver: gameOver,
    tennisGamesScoreA: gamesA, tennisGamesScoreB: gamesB,
    tennisCurrentRallyA: rallyA, tennisCurrentRallyB: rallyB,
    isTennisTiebreak: isTiebreak, tieBreakScoreA: tieA, tieBreakScoreB: tieB,
    isChangeEndsNeeded: false,
    consecutivePointsA: streak(points,'A'), consecutivePointsB: streak(points,'B')
  };
}
function streak(points, who){
  let n=0;
  for (let i=points.length-1;i>=0;i--){ if(points[i]===who) n++; else break; }
  return n;
}
function tennisPointLabel(a, b){
  const names=['0','15','30','40'];
  if (a>=3 && b>=3){
    if (a===b) return {a:'40', b:'40'};
    if (a===b+1) return {a:'AD', b:'40'};
    if (b===a+1) return {a:'40', b:'AD'};
  }
  return {a:names[Math.min(a,3)], b:names[Math.min(b,3)]};
}

/* セット列から勝敗を判定する（Android版 getIndividualResultType 相当） */
function decideWinner(sets, sport){
  if (!sets || sets.length===0) return {result:'DRAW', mySets:0, oppSets:0, finalResultCode:'NORMAL'};
  for (const s of sets){
    if (s.specialResult==='RET') return {result:'LOSS', mySets:0, oppSets:0, finalResultCode:'RET'};
    if (s.specialResult==='WO') return {result:'WIN', mySets:0, oppSets:0, finalResultCode:'WO'};
    if (s.specialResult==='DEF') return {result:'LOSS', mySets:0, oppSets:0, finalResultCode:'DEF'};
  }
  let mySets=0, oppSets=0;
  for (const s of sets){
    const my = (s.myScore==null?0:s.myScore), op=(s.opponentScore==null?0:s.opponentScore);
    if (my===0 && op===0) continue;
    if (my===op){
      // 同点セットはタイブレークがある場合のみ判定し、なければ引き分け扱いで数えない
      if (s.tieBreakMy!=null && s.tieBreakOpponent!=null){
        if (s.tieBreakMy>s.tieBreakOpponent) mySets++; else if (s.tieBreakOpponent>s.tieBreakMy) oppSets++;
      }
      continue;
    }
    if (my>op) mySets++; else oppSets++;
  }
  const result = mySets>oppSets?'WIN':(oppSets>mySets?'LOSS':'DRAW');
  return {result, mySets, oppSets, finalResultCode:'NORMAL'};
}
/* 試合保存時に派生値を再計算する（isWin / finalResultCode） */
function deriveMatch(m){
  const sets = parseScoresJson(m.scoresJson);
  const d = decideWinner(sets, m.sportType);
  m.isWin = (d.result==='WIN');
  m.finalResultCode = d.finalResultCode;
  return m;
}

/* =====================================================================
   IndexedDB（DB名 smashstats-web）— 生の IndexedDB API のみで実装
   ===================================================================== */
const DB_NAME='smashstats-web', DB_VERSION=1;
const STORES=[
  {name:'players', key:'playerId'},
  {name:'matches', key:'matchId'},
  {name:'gears', key:'gearId'},
  {name:'gear_maintenances', key:'maintenanceId'},
  {name:'venues', key:'id', auto:true},
  {name:'opponent_profiles', key:'opponentId'},
  {name:'opponent_custom_items', key:'id'},
  {name:'focuses', key:'focusId'},
  {name:'notes', key:'noteId'},
  {name:'_outbox', key:'outboxId', auto:true},
  {name:'_meta', key:'key'}
];
let dbPromise=null;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function(resolve, reject){
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(){
      const db = req.result;
      for (const s of STORES){
        if (db.objectStoreNames.contains(s.name)) continue;
        db.createObjectStore(s.name, s.auto?{keyPath:s.key, autoIncrement:true}:{keyPath:s.key});
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return dbPromise;
}
function idbTx(storeNames, mode, fn){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(storeNames, mode);
      const out = fn(tx);
      tx.oncomplete = function(){ resolve(out && out.value!==undefined?out.value:out); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error||new Error('tx aborted')); };
    });
  });
}
function idbPut(store, value){
  return idbTx([store,'_outbox'], 'readwrite', function(tx){
    const req = tx.objectStore(store).put(value);
    const holder = {};
    req.onsuccess = function(){ holder.value = req.result; };
    if (store!=='_outbox' && store!=='_meta'){
      const key = value[STORES.find(function(s){return s.name===store;}).key];
      tx.objectStore('_outbox').add({
        table:store, rowId:String(key), op:'upsert',
        payload:JSON.stringify(value), createdAt:Date.now(), tryCount:0, lastError:null
      });
    }
    return holder;
  });
}
function idbDelete(store, key){
  return idbTx([store,'_outbox'], 'readwrite', function(tx){
    const req = tx.objectStore(store).delete(key);
    const holder = {};
    req.onsuccess = function(){ holder.value = true; };
    tx.objectStore('_outbox').add({
      table:store, rowId:String(key), op:'delete',
      payload:'', createdAt:Date.now(), tryCount:0, lastError:null
    });
    return holder;
  });
}
function idbGet(store, key){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const req = db.transaction(store,'readonly').objectStore(store).get(key);
      req.onsuccess = function(){ resolve(req.result||null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbAll(store){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const req = db.transaction(store,'readonly').objectStore(store).getAll();
      req.onsuccess = function(){ resolve(req.result||[]); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbClear(store){
  return idbTx([store], 'readwrite', function(tx){ tx.objectStore(store).clear(); return {}; });
}
function metaGet(key){ return idbGet('_meta', key).then(function(r){ return r?r.value:null; }); }
function metaSet(key, value){ return idbPut('_meta', {key:key, value:value}); }

/* _outbox を経由しない生の読み書き（同期エンジン用）。
   サーバーから受け取った行をそのまま入れる・outboxの掃除に使う。
   idbPut/idbDelete は使うと新たに outbox へ積んでしまうため、同期では使わない。 */
function idbRawPut(store, value){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).put(value);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbRawDelete(store, key){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).delete(key);
      req.onsuccess = function(){ resolve(true); };
      req.onerror = function(){ reject(req.error); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function extractSpreadsheetId(input){
  if (!input) return null;
  const s = String(input).trim();
  const m = s.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9-_]{20,}$/.test(s)) return s;
  return null;
}

/* ブリッジURLは https が原則。http はローカル検証用（127.0.0.1 / localhost）のみ許可。
   https の場合は /exec で終わるものだけ受け付ける（Safariで開いたときの転送先
   googleusercontent.com/macros/echo のURLを貼る間違いを防ぐ）。 */
function isBridgeUrlOk(url){
  if (!url) return false;
  if (url.indexOf('https://')===0) return url.replace(/\/+$/,'').endsWith('/exec');
  return url.indexOf('http://127.0.0.1')===0 || url.indexOf('http://localhost')===0;
}
function syncConfigured(){
  const s = state.sync;
  return !!(s.bridgeUrl && isBridgeUrlOk(s.bridgeUrl) && s.spreadsheetId && s.secret);
}

/* 設定欄の入力値を読み、_meta へ保存する。空の合言葉欄は「現状維持」とする。 */
async function syncSaveSettingsUI(quiet){
  const bridgeEl = document.getElementById('sync-bridge');
  const sheetEl = document.getElementById('sync-sheet');
  const secretEl = document.getElementById('sync-secret');
  if (!bridgeEl || !sheetEl || !secretEl) return false;
  const bridgeUrl = bridgeEl.value.trim();
  const sheetUrl = sheetEl.value.trim();
  const secretInput = secretEl.value;
  if (!bridgeUrl || !isBridgeUrlOk(bridgeUrl)){
    updateSyncStatus(bridgeUrl.indexOf('googleusercontent.com/macros/echo')>=0 ? t('sync_bad_url_redirect') : t('sync_bad_url')); return false;
  }
  const sheetId = extractSpreadsheetId(sheetUrl);
  if (!sheetId){
    updateSyncStatus(t('sync_bad_sheet')); return false;
  }
  const secret = secretInput ? secretInput : state.sync.secret;
  if (!secret){
    updateSyncStatus(t('sync_need_secret')); return false;
  }
  if (secret.length < 8){
    updateSyncStatus(t('sync_secret_short')); return false;
  }
  state.sync.bridgeUrl = bridgeUrl;
  state.sync.spreadsheetUrl = sheetUrl;
  state.sync.spreadsheetId = sheetId;
  state.sync.secret = secret;
  await metaSet('syncBridgeUrl', bridgeUrl);
  await metaSet('syncSpreadsheetUrl', sheetUrl);
  await metaSet('syncSpreadsheetId', sheetId);
  await metaSet('syncSecret', secret);
  secretEl.value = '';
  secretEl.placeholder = t('sync_secret_set');
  if (!quiet){ toast(t('saved')); updateSyncStatus(''); }
  return true;
}

/* ブリッジ呼び出し。Apps Script は Content-Type: text/plain で送ると
   プリフライト無しで呼べる。応答は常に JSON {ok:true/false,...}。
   60秒応答がなければ打ち切る（Apps Script のリダイレクト経由は遅く、
   無期限に待つと「ボタンが効かない」ように見えるため）。 */
async function syncCall(action, body){
  const payload = Object.assign({action:action, secret:state.sync.secret}, body||{});
  let res;
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, SYNC_CALL_TIMEOUT_MS) : null;
  try {
    res = await fetch(state.sync.bridgeUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch (e){
    if (e && e.name === 'AbortError'){
      const err = new Error('timeout');
      err.isTimeout = true;
      throw err;
    }
    const err = new Error('network_error');
    err.isNetwork = true;
    throw err;
  } finally {
    if (timer) clearTimeout(timer);
  }
  let data = null;
  try { data = await res.json(); } catch (e){ throw new Error('bad_response'); }
  if (!data || data.ok !== true){
    const err = new Error((data && data.message) || (data && data.error) || 'bridge_error');
    err.data = data;
    err.status = res.status;
    throw err;
  }
  return data;
}

/* 429 / LOCKED 時は1分待って指数バックオフで再試行する（最大3回）。 */
async function syncCallWithRetry(action, body){
  let delay = 60000;
  for (let attempt=0; attempt<4; attempt++){
    try {
      return await syncCall(action, body);
    } catch (err){
      const code = (err && err.data && err.data.error) || (err && err.message) || '';
      const isRate = code==='RATE_LIMIT' || code==='LOCKED' || err.status===429;
      if (!isRate || attempt===3) throw err;
      updateSyncStatus(jaEn('制限中のため ','Rate limited. Retrying in ') + Math.round(delay/1000) + jaEn('秒後に再試行します…','s…'));
      await sleep(delay);
      delay *= 2;
    }
  }
  throw new Error('retry_exhausted');
}

/* _outbox をテーブルごとにまとめて push する。成功した分だけ outbox から消す。 */
async function syncPush(){
  const entries = (await idbAll('_outbox')).sort(function(a,b){ return a.createdAt-b.createdAt; });
  if (!entries.length) return {pushed:0, conflicts:[]};
  const byTable = {};
  entries.forEach(function(e){ (byTable[e.table] = byTable[e.table] || []).push(e); });
  const deviceId = await metaGet('deviceId');
  let pushed = 0;
  const conflicts = [];
  for (const table of Object.keys(byTable)){
    const list = byTable[table];
    const rows = [];
    const rowEntryIds = [];
    for (const e of list){
      if (e.op === 'delete'){
        // 論理削除の墓標行（isDeleted=true）。updatedAt には削除時刻を使う。
        const idField = SYNC_ID_FIELD[table];
        const row = {};
        row[idField] = (table==='venues') ? Number(e.rowId) : e.rowId;
        row.isDeleted = true;
        row.updatedAt = e.createdAt;
        rows.push(row);
        rowEntryIds.push(e.outboxId);
      } else {
        try {
          rows.push(JSON.parse(e.payload));
          rowEntryIds.push(e.outboxId);
        } catch (err){
          await idbRawDelete('_outbox', e.outboxId); // 壊れたエントリは捨てる
        }
      }
    }
    for (let i=0; i<rows.length; i+=SYNC_PUSH_CHUNK){
      const chunk = rows.slice(i, i+SYNC_PUSH_CHUNK);
      const chunkIds = rowEntryIds.slice(i, i+SYNC_PUSH_CHUNK);
      const body = {spreadsheetId: state.sync.spreadsheetId, deviceId: deviceId, rows: {}};
      body.rows[table] = chunk;
      let data;
      try {
        data = await syncCallWithRetry('push', body);
      } catch (err){
        for (const id of chunkIds){
          const en = await idbGet('_outbox', id);
          if (en){ en.tryCount = (en.tryCount||0)+1; en.lastError = String((err && err.message) || err); await idbRawPut('_outbox', en); }
        }
        throw err;
      }
      // サーバー側の処理上限で残りが出た場合は、続きをそのまま再送する。
      let remaining = data.remaining && data.remaining[table];
      let guard = 0;
      while (remaining && remaining.length && guard++ < 20){
        const body2 = {spreadsheetId: state.sync.spreadsheetId, deviceId: deviceId, rows: {}};
        body2.rows[table] = remaining;
        const d2 = await syncCallWithRetry('push', body2);
        if (d2.conflicts) conflicts.push.apply(conflicts, d2.conflicts);
        pushed += (d2.applied && d2.applied[table]) || 0;
        remaining = d2.remaining && d2.remaining[table];
      }
      if (data.conflicts) conflicts.push.apply(conflicts, data.conflicts);
      pushed += (data.applied && data.applied[table]) || 0;
      // 反映済み（競合でシート側が勝った行を含む）は outbox から消す。
      // 競合した行のローカル側は、このあとの pull でシートの内容に更新される。
      for (const id of chunkIds) await idbRawDelete('_outbox', id);
    }
  }
  return {pushed: pushed, conflicts: conflicts};
}

/* pull で受け取った行を、updatedAt 比較で IndexedDB へ取り込む。 */
function normalizePulledRow(table, srv){
  const row = Object.assign({}, srv);
  // JSON文字列の列が万一オブジェクトで来た場合は文字列化する。
  ['scoresJson','opponentMembersJson','customItemsJson','photoUrisJson','strongShotsJson','weakShotsJson','strongCoursesJson','weakCoursesJson'].forEach(function(k){
    if (row[k] !== undefined && row[k] !== null && typeof row[k] !== 'string') row[k] = JSON.stringify(row[k]);
  });
  if (table==='matches' && (row.scoresJson === undefined || row.scoresJson === null)) row.scoresJson = '[]';
  if (row.isDeleted === undefined || row.isDeleted === null) row.isDeleted = false;
  return row;
}

async function syncPull(){
  let offset = {};
  let inserted = 0, updated = 0, keptLocal = 0;
  for (let round=0; round<50; round++){
    const data = await syncCallWithRetry('pull', {spreadsheetId: state.sync.spreadsheetId, offset: offset, limit: SYNC_PULL_LIMIT});
    const rows = data.rows || {};
    for (const table of SYNC_TABLES){
      const list = rows[table] || [];
      for (const srv of list){
        const idField = SYNC_ID_FIELD[table];
        const id = srv[idField];
        if (id === undefined || id === null || id === '') continue;
        const local = await idbGet(table, id);
        if (!local){
          await idbRawPut(table, normalizePulledRow(table, srv));
          inserted++;
        } else if (SYNC_HAS_UPDATED_AT[table]){
          const sUp = Number(srv.updatedAt)||0, lUp = Number(local.updatedAt)||0;
          if (sUp > lUp){
            await idbRawPut(table, normalizePulledRow(table, srv));
            updated++;
          } else if (lUp > sUp){
            keptLocal++;
            // ローカルの方が新しいのに outbox に無ければ、次回 push できるよう積む。
            const pending = (await idbAll('_outbox')).some(function(e){ return e.table===table && String(e.rowId)===String(id); });
            if (!pending) await idbPut(table, local);
          }
        } else {
          // updatedAt が無いテーブル（張り替え履歴・対戦相手カスタム項目）はローカル優先。
          keptLocal++;
        }
      }
    }
    const hasMore = data.hasMore || {};
    const next = data.nextOffset || {};
    let more = false;
    offset = {};
    for (const table of SYNC_TABLES){
      if (hasMore[table]){ more = true; offset[table] = next[table] || 0; }
    }
    if (!more) break;
    if (round===49) throw new Error('pull_too_many_rounds');
  }
  return {inserted: inserted, updated: updated, keptLocal: keptLocal, serverTime: Date.now()};
}

/* 同期の現在状態を #sync-status へ描く（入力欄には触らない）。 */

/* 同期中の進捗表示（段階＋経過秒）。#sync-status だけを更新し、入力欄には触らない。 */
let syncTickTimer = null;
function syncElapsedText(){
  const s = state.sync;
  const sec = s.startedAt ? Math.floor((Date.now() - s.startedAt)/1000) : 0;
  const phase = s.phase==='push' ? t('sync_phase_push')
    : s.phase==='pull' ? t('sync_phase_pull') : t('sync_syncing');
  return phase + (LANG==='ja' ? '（' + sec + '秒）' : ' (' + sec + 's)');
}
function syncTickStart(){
  syncTickStop();
  state.sync.startedAt = Date.now();
  updateSyncStatus(syncElapsedText());
  syncTickTimer = setInterval(function(){
    if (!state.sync.syncing){ syncTickStop(); return; }
    updateSyncStatus(syncElapsedText());
  }, 1000);
}
function syncTickStop(){
  if (syncTickTimer){ clearInterval(syncTickTimer); syncTickTimer = null; }
}

/* 同期1回分（push → pull）。auto時は失敗しても画面を再描画しない。 */
async function syncNow(opts){
  opts = opts || {};
  if (state.sync.syncing){ updateSyncStatus(state.sync.startedAt ? syncElapsedText() : t('sync_syncing')); return null; }
  if (!syncConfigured()){
    updateSyncStatus(t('sync_need_config'));
    return null;
  }
  state.sync.syncing = true;
  state.sync.phase = 'push';
  syncTickStart();
  let pushRes = {pushed:0, conflicts:[]};
  let pullRes = null;
  let pushErr = null, pullErr = null;
  try {
    if (navigator.onLine === false) throw new Error('offline');
    pushRes = await syncPush();
  } catch (err){ pushErr = err; }
  try {
    state.sync.phase = 'pull';
    updateSyncStatus(syncElapsedText());
    pullRes = await syncPull();
  } catch (err){ pullErr = err; }
  state.sync.syncing = false;
  syncTickStop();
  state.sync.phase = null;
  const conflicts = pushRes.conflicts || [];
  if (conflicts.length){
    state.sync.conflictCount = (state.sync.conflictCount||0) + conflicts.length;
    await metaSet('syncConflictCount', state.sync.conflictCount);
  }
  const firstErr = pushErr || pullErr;
  if (!firstErr || pullRes){
    // pull が成功した、または push が成功した場合は同期時刻を更新する。
    state.sync.lastSyncAt = pullRes ? (pullRes.serverTime || Date.now()) : Date.now();
    await metaSet('lastSyncAt', state.sync.lastSyncAt);
  }
  if (firstErr){
    const msg = firstErr.message==='offline' ? t('sync_offline')
      : firstErr.message==='timeout' ? t('sync_timeout')
      : firstErr.message==='network_error' ? t('sync_push_failed')
      : (firstErr.data && firstErr.data.message) ? String(firstErr.data.message)
      : t('sync_push_failed');
    state.sync.lastError = msg;
    await metaSet('syncLastError', msg);
    state.sync.statusText = '';
    updateSyncStatus();
    if (!opts.silent) proNotice(msg);
    await afterSyncRefresh(opts);
    return {ok:false, error:msg, pushed:pushRes.pushed, conflicts:conflicts};
  }
  state.sync.lastError = null;
  await metaSet('syncLastError', null);
  state.sync.statusText = t('sync_done')
    + (conflicts.length ? ' ' + t('sync_conflict_note') : '')
    + jaEn('（送信 ',' (sent ') + pushRes.pushed + jaEn('件 / 新規 ',' / new ') + (pullRes?pullRes.inserted:0) + jaEn('件 / 更新 ',' / updated ') + (pullRes?pullRes.updated:0) + jaEn('件）',')');
  updateSyncStatus();
  if (!opts.silent && !opts.auto) toast(t('sync_done'));
  await afterSyncRefresh(opts);
  return {ok:true, pushed:pushRes.pushed, pull:pullRes, conflicts:conflicts};
}

/* 同期後の画面更新。自動同期では、同期設定の入力欄にフォーカスがある間は

/* =====================================================================
   ライセンス（Phase 4: Stripe買い切り＋Cloudflare Worker）
   キーそのものは端末内に保存しない。保存するのは SHA-256 ハッシュだけ
   （設計書 DESIGN.md §7・§13）。サーバー側は license-worker/src/index.js。
   無効化されても過去のデータは読める・書き出せる。新規登録だけ無料枠に戻る。
   ネットワークの失敗では Pro を解除しない（サーバーからの確定応答だけが解除する）。
   ===================================================================== */
function licenseWorkerUrl(){ return (state.license.workerUrl || LICENSE_WORKER_URL || '').trim(); }
function licenseConfigured(){ return !!licenseWorkerUrl(); }
async function sha256Hex(str){
  if (!crypto || !crypto.subtle) throw new Error('crypto_unavailable');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
}
function canonicalLicenseKey(key){ return String(key||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
async function licenseCall(path, body){
  const url = licenseWorkerUrl().replace(/\/+$/,'') + path;
  let res;
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, LICENSE_CALL_TIMEOUT_MS) : null;
  try {
    res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body||{}), signal: ctrl ? ctrl.signal : undefined});
  } catch(e){
    if (e && e.name==='AbortError'){ const er=new Error('timeout'); er.isTimeout=true; throw er; }
    const er=new Error('network_error'); er.isNetwork=true; throw er;
  } finally { if (timer) clearTimeout(timer); }
  let data=null;
  try { data = await res.json(); } catch(e){ throw new Error('bad_response'); }
  return data;
}
function licenseErrText(data){
  const code = (data && data.error) || '';
  if (code==='INVALID_KEY') return t('lic_invalid');
  if (code==='REVOKED') return t('lic_revoked');
  if (code==='DEVICE_LIMIT') return t('lic_device_limit');
  if (code==='PROMO_INVALID') return t('lic_promo_invalid');
  if (code==='ALREADY_CLAIMED') return t('lic_claimed_before');
  if (code==='NOT_PAID' || code==='REFUNDED') return t('lic_claim_failed');
  if (code==='PRICE_NOT_CONFIGURED') return t('lic_price_soon');
  return t('lic_network');
}
async function setProLocal(on, info){
  state.isPro = !!on;
  await metaSet('isPro', !!on);
  if (on){
    const now = Date.now();
    state.license.lastVerifiedAt = now;
    await metaSet('licenseLastVerifiedAt', now);
    if (info){
      if (info.email){ state.license.email = info.email; await metaSet('licenseEmail', info.email); }
      if (info.devices != null){ state.license.devices = info.devices; await metaSet('licenseDevices', info.devices); }
    }
  }
}

/* ライセンスキーを入力して有効化する（ハッシュだけを送る・保存する）。 */
async function licenseVerifyUI(){
  if (!licenseConfigured()){ proNotice(t('lic_not_configured')); return; }
  const el = document.getElementById('lic-key');
  const raw = el ? el.value.trim() : '';
  if (!raw){ proNotice(t('lic_invalid')); return; }
  let hash;
  try { hash = await sha256Hex(canonicalLicenseKey(raw)); }
  catch(e){ proNotice(t('lic_crypto')); return; }
  try {
    const data = await licenseCall('/api/verify', {keyHash: hash, deviceId: await metaGet('deviceId')});
    if (data && data.ok){
      await metaSet('licenseKeyHash', hash);
      state.license.keyHash = hash;
      state.license.justIssued = '';
      await setProLocal(true, data);
      toast(t('lic_activated'));
      render();
    } else proNotice(licenseErrText(data));
  } catch(e){ proNotice(t('lic_network')); }
}

/* 発行直後のキーを1回だけコピーする。 */
function licenseCopyKey(){
  const key = state.license.justIssued;
  if (!key) return;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(key).then(function(){ toast(t('lic_copied')); }, function(){ licenseCopyFallback(key); });
  } else licenseCopyFallback(key);
}
function licenseCopyFallback(key){
  const ta = document.createElement('textarea');
  ta.value = key; document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); toast(t('lic_copied')); } catch(e){ proNotice(key); }
  ta.remove();
}
/* Stripe 決済からの戻り（?license_session=...）でライセンスを発行する。 */
async function licenseClaimFromUrl(){
  let sid = null;
  try { sid = new URLSearchParams(location.search).get('license_session'); } catch(e){}
  if (!sid) return;
  if (!licenseConfigured()){ proNotice(t('lic_not_configured')); return; }
  let done = false;
  try {
    const data = await licenseCall('/api/claim', {sessionId: sid, deviceId: await metaGet('deviceId')});
    done = true;
    if (data && data.ok && data.licenseKey){
      const hash = await sha256Hex(canonicalLicenseKey(data.licenseKey));
      await metaSet('licenseKeyHash', hash);
      state.license.keyHash = hash;
      state.license.justIssued = data.licenseKey;
      await setProLocal(true, data);
      toast(t('lic_claim_done'));
      if (state.view === 'settings') render();
    } else proNotice(licenseErrText(data));
  } catch(e){ proNotice(t('lic_network')); }
  // 確定した結果が出たときだけURLをきれいにする（通信失敗時は再試行できるよう残す）。
  if (done){ try { history.replaceState(null, '', location.pathname + location.hash); } catch(e){} }
}
/* Pro の定期的な再確認。7日以上たっていてオンラインのときだけ。
   サーバーからの確定応答（無効化・台数超過）でのみ Pro を解除する。 */
async function licenseReverifySilent(){
  if (!state.isPro || !licenseConfigured() || navigator.onLine === false) return;
  if (!state.license.keyHash) return;
  const last = state.license.lastVerifiedAt || 0;
  if (Date.now() - last < LICENSE_REVERIFY_DAYS * 86400000) return;
  try {
    const data = await licenseCall('/api/verify', {keyHash: state.license.keyHash, deviceId: await metaGet('deviceId')});
    if (data && data.ok){ await setProLocal(true, data); }
    else if (data && (data.error==='REVOKED' || data.error==='INVALID_KEY' || data.error==='DEVICE_LIMIT')){
      await setProLocal(false);
      proNotice(t('lic_reverify_failed'));
      render();
    }
  } catch(e){ /* オフライン等: 確認できない期間は Pro のまま */ }
}

  outboxCount:0, isPro:false, persisted:null, demo:false,

  sync:{bridgeUrl:'', spreadsheetUrl:'', spreadsheetId:'', secret:'', lastSyncAt:null, lastError:null, conflictCount:0, syncing:false, statusText:'', phase:null, startedAt:null},
  search:'', filter:'all',
  editingMatchId:null, editingGearId:null,
  venues:[], opponentProfiles:[],
  analyticsPeriod:'all', igMode:'summary', aiKind:'issues', aiText:'',
  draft:null, // 試合フォームの下書き（メモリ上のみ）

async function loadAll(){
  const p = await idbAll('players');
  state.players = p.filter(function(x){return !x.isDeleted;}).sort(function(a,b){return a.createdAt-b.createdAt;});
  state.matches = (await idbAll('matches')).filter(function(x){return !x.isDeleted;});
  state.gears = (await idbAll('gears')).filter(function(x){return !x.isDeleted;});
  state.maintenances = await idbAll('gear_maintenances');
  state.focuses = (await idbAll('focuses')).filter(function(x){return !x.isDeleted;});
  state.notes = (await idbAll('notes')).filter(function(x){return !x.isDeleted;});
  state.venues = (await idbAll('venues')).filter(function(x){return !x.isDeleted;});
  state.opponentProfiles = (await idbAll('opponent_profiles')).filter(function(x){return !x.isDeleted;});
  state.outboxCount = (await idbAll('_outbox')).length;
  state.isPro = (await metaGet('isPro'))===true;
  state.demo = (await metaGet('demo'))===true;
  // ライセンス（キーそのものは保存しない。ハッシュだけ）
  state.license.workerUrl = (await metaGet('licenseWorkerUrl'))||'';
  state.license.keyHash = (await metaGet('licenseKeyHash'))||'';
  state.license.email = (await metaGet('licenseEmail'))||'';
  state.license.lastVerifiedAt = await metaGet('licenseLastVerifiedAt');
  state.license.devices = (await metaGet('licenseDevices'))||0;
  // 同期設定（合言葉を含む。_meta は書き出し・同期の対象外）
  state.sync.bridgeUrl = (await metaGet('syncBridgeUrl'))||'';
  state.sync.spreadsheetUrl = (await metaGet('syncSpreadsheetUrl'))||'';
  state.sync.spreadsheetId = (await metaGet('syncSpreadsheetId'))||'';
  state.sync.secret = (await metaGet('syncSecret'))||'';
  state.sync.lastSyncAt = await metaGet('lastSyncAt');
  state.sync.lastError = await metaGet('syncLastError');
  state.sync.conflictCount = (await metaGet('syncConflictCount'))||0;
  if (!state.currentPlayerId || !state.players.some(function(x){return x.playerId===state.currentPlayerId;})){
    state.currentPlayerId = state.players.length?state.players[0].playerId:null;
    if (state.currentPlayerId) localStorage.setItem('ss-player', state.currentPlayerId);
  }
}
function currentPlayer(){
  return state.players.find(function(p){return p.playerId===state.currentPlayerId;})||null;
}
function playerMatches(pid){
  const id = pid||state.currentPlayerId;
  return state.matches.filter(function(m){return m.playerId===id;})
    .sort(function(a,b){return (b.matchDateEpochDay-a.matchDateEpochDay)||(b.createdAt-a.createdAt);});
}
function monthMatchCount(pid){
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth();
  return state.matches.filter(function(m){
    if(m.playerId!==pid) return false;
    const d=new Date(m.createdAt);
    return d.getFullYear()===y && d.getMonth()===mo;
  }).length;
}

/* ---------------- 画面描画 ---------------- */
function setTab(tab){
  state.tab=tab; state.view='tab';
  if(tab==='register' && !state.draft) newDraft();
  render();
}
function render(){
  document.body.dataset.theme = THEME;
  document.documentElement.lang = (LANG==='ja'?'ja':'en');
  renderPlayerSelect();
  renderInstallBanner();
  $all('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  $all('#tabbar button').forEach(function(b){
    b.classList.toggle('active', state.view==='tab' && b.dataset.tab===state.tab);
  });
  const view = $('#view');
  if (state.view==='settings'){ view.innerHTML = settingsHTML(); return; }
  if (state.tab==='home') view.innerHTML = homeHTML();
  else if (state.tab==='matches') view.innerHTML = matchesHTML();
  else if (state.tab==='register') view.innerHTML = registerHTML();
  else if (state.tab==='analytics'){ view.innerHTML = analyticsHTML(); setTimeout(igDraw, 0); }
  else if (state.tab==='gear') view.innerHTML = gearHTML();
  if (state.tab==='matches') bindMatchesSearch();
}
function renderPlayerSelect(){
  const sel = $('#player-select');
  const cur = state.currentPlayerId;
  sel.innerHTML = state.players.map(function(p){
    return '<option value="'+esc(p.playerId)+'"'+(p.playerId===cur?' selected':'')+'>'+esc(p.playerName)+'</option>';
  }).join('') + '<option value="__add__">＋ '+esc(t('add_player'))+'</option>';
  if (!state.players.length) sel.innerHTML = '<option value="__add__">＋ '+esc(t('add_player'))+'</option>';
}
function renderInstallBanner(){
  const el = $('#install-banner');
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  const dismissed = localStorage.getItem('ss-install-dismissed')==='1';
  if (standalone || dismissed){ el.classList.remove('show'); el.innerHTML=''; return; }
  el.innerHTML = '<div>'+esc(t('install_title'))+'<br><span class="small">'+esc(t('install_how'))+'</span></div>'
    + '<button type="button" id="install-close">'+esc(t('install_close'))+'</button>';
  el.classList.add('show');
  const btn = $('#install-close');
  if (btn) btn.addEventListener('click', function(){
    localStorage.setItem('ss-install-dismissed','1'); renderInstallBanner();
  });
}
function toast(msg){
  const view = $('#view');
  const d = document.createElement('div');
  d.className='notice info'; d.textContent = msg;
  view.prepend(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 3500);
}
function proNotice(msg){
  const view = $('#view');
  const d = document.createElement('div');
  d.className='notice'; d.textContent = msg;
  view.prepend(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 5000);
}

function matchesHTML(){

  h += '<div class="tabs-inline">'
    + '<button type="button" data-filter="all" class="'+(state.filter==='all'?'active':'')+'">'+esc(t('all'))+'</button>'

  h += '<button type="button" class="primary block" onclick="newDraft(); setTab(\'register\')">＋ '+esc(t('register_match'))+'</button>';
  return h;
}
function filteredMatches(){
  const q = state.search.trim();
  return playerMatches().filter(function(m){
    if (state.filter==='win' && !m.isWin) return false;
    if (state.filter==='loss' && m.isWin) return false;
    if (!q) return true;
    return (m.opponentDisplayName||'').includes(q) || (m.tournamentName||'').includes(q);
  });
}
function matchListHTML(){
  const list = filteredMatches();
  if (!list.length) return '<div class="empty">'+esc(t('no_matches'))+'</div>';
  return list.map(matchCardHTML).join('');
}
function bindMatchesSearch(){
  const input = $('#match-search');
  if (input){
    // IME対応: oninput では一覧部分だけを更新し、入力欄自体は触らない
    input.addEventListener('input', function(){
      state.search = input.value;
      const list = $('#match-list');
      if (list) list.innerHTML = matchListHTML();
    });

  $all('[data-filter]').forEach(function(b){
    b.addEventListener('click', function(){ state.filter=b.dataset.filter; render(); });

/* =====================================================================
   分析エンジン（AnalyticsEngine.kt の移植。純粋関数）
   IndexedDBの試合一覧からクライアント内で計算する。サーバー集計なし。
   勝敗判定は Android の getIndividualResultType に準拠。
   ===================================================================== */
function anScores(m){ return parseScoresJson(m.scoresJson); }
function anResult(m){ /* Android getIndividualResultType 相当 */
  if (m.finalResultCode==='RET') return 'LOSS';
  const ss = anScores(m);
  if (!ss.length || ss.every(function(s){ return (s.myScore||0)===0 && (s.opponentScore||0)===0; })){
    return m.isWin?'WIN':'LOSS';
  }
  let my=0, op=0;
  ss.forEach(function(s){
    const a=s.myScore||0, b=s.opponentScore||0;
    if (a>b) my++; else if (b>a) op++;
  });
  return my>op?'WIN':(op>my?'LOSS':'DRAW');
}
function anIsSpecial(m){
  if (m.finalResultCode==='RET'||m.finalResultCode==='WO'||m.finalResultCode==='DEF') return true;
  return anScores(m).some(function(s){ return s.specialResult==='RET'||s.specialResult==='WO'||s.specialResult==='DEF'; });
}
function anRate(list){
  if (!list.length) return 0;
  const w = list.filter(function(m){ return anResult(m)==='WIN'; }).length;
  return w/list.length*100;
}
function anWins(list){ return list.filter(function(m){ return anResult(m)==='WIN'; }).length; }
function anLosses(list){ return list.filter(function(m){ return anResult(m)==='LOSS'; }).length; }
function anRoundOrder(name){
  const map = {'リーグ戦':1,'1回戦':10,'2回戦':11,'3回戦':12,'4回戦':13,'5回戦':14,'準々決勝':15,'準決勝':16,'3位決定戦':17,'決勝':18,'練習会':20};
  return (name && map[name]) || 99;
}
function anResolveYear(m){
  if (m.tournamentYear && m.tournamentYear>1990) return m.tournamentYear;
  if (m.matchDateEpochDay>0) return new Date(m.matchDateEpochDay*86400000).getUTCFullYear();
  if (m.createdAt>0) return new Date(m.createdAt).getFullYear();
  return 0;
}
function anMonthKey(m){
  const d = new Date(m.matchDateEpochDay*86400000);
  return d.getUTCFullYear()+'/'+String(d.getUTCMonth()+1).padStart(2,'0');
}
function anWeekday(m){ return new Date(m.matchDateEpochDay*86400000).getUTCDay(); } /* 0=日..6=土 */
function pct1(x){ return (Math.round(x*10)/10).toFixed(1)+'%'; }
function pct0(x){ return Math.round(x)+'%'; }
function kvRow(label, value){ return '<div class="kv"><span>'+esc(label)+'</span><b>'+value+'</b></div>'; }
function barRow(label, rate, sub){
  return '<div class="bar-row"><span class="bar-label">'+esc(label)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(0,Math.min(100,rate))+'%"></div></div><span class="bar-val">'+esc(sub)+'</span></div>';
}
function noDataHTML(){ return '<p class="muted">'+esc(t('an_no_data'))+'</p>'; }

function anLayerA(ms){
  const total = ms.length;
  if (!total) return {unlocked:false, total:0, wins:0, winRate:0, r5:{wins:0,total:0,rate:0}, monthly:[]};
  const wins = anWins(ms), losses = anLosses(ms);
  const draws = Math.max(0, total-wins-losses);
  const sortedDesc = ms.slice().sort(function(a,b){
    return (b.matchDateEpochDay-a.matchDateEpochDay) || (anRoundOrder(b.roundName)-anRoundOrder(a.roundName)) || (b.createdAt-a.createdAt);
  });
  const r5 = sortedDesc.slice(0,5), r10 = sortedDesc.slice(0,10);
  let gc=0, pd=0;
  ms.forEach(function(m){
    if (anIsSpecial(m)) return;
    anScores(m).forEach(function(s){
      const a=s.myScore||0, b=s.opponentScore||0;
      if (a>0||b>0){ gc++; pd+=(a-b); }
    });
  });
  const team = ms.filter(function(m){return m.isTeamMatch;});
  const indiv = ms.filter(function(m){return !m.isTeamMatch;});
  const byMonth = {};
  ms.forEach(function(m){ const k=anMonthKey(m); (byMonth[k]=byMonth[k]||[]).push(m); });
  const monthly = Object.keys(byMonth).sort().map(function(k){
    return {label:k, total:byMonth[k].length, wins:anWins(byMonth[k]), rate:anRate(byMonth[k])};
  });
  const byYear = {};
  ms.forEach(function(m){ const y=anResolveYear(m); if(y>0){ (byYear[y]=byYear[y]||[]).push(m); } });
  const annual = Object.keys(byYear).map(Number).sort(function(a,b){return b-a;}).map(function(y){
    return {year:y, wins:anWins(byYear[y]), losses:anLosses(byYear[y]), draws:Math.max(0, byYear[y].length-anWins(byYear[y])-anLosses(byYear[y]))};
  });
  const asc = sortedDesc.slice().reverse();
  let mxW=0, mxL=0, cW=0, cL=0;
  asc.forEach(function(m){
    const r=anResult(m);
    if (r==='WIN'){ cW++; mxW=Math.max(mxW,cW); cL=0; }
    else if (r==='LOSS'){ cL++; mxL=Math.max(mxL,cL); cW=0; }
    else { cW=0; cL=0; }
  });
  let curStreak = {type:null, n:0};
  if (asc.length){
    const last = anResult(asc[asc.length-1]);
    let n=0;
    for (let i=asc.length-1;i>=0;i--){ if (anResult(asc[i])===last) n++; else break; }
    curStreak = {type:last, n:n};
  }
  let wdW=0, wdT=0, weW=0, weT=0;
  ms.forEach(function(m){
    const dow = anWeekday(m);
    if (dow===0 || dow===6){ weT++; if (anResult(m)==='WIN') weW++; }
    else { wdT++; if (anResult(m)==='WIN') wdW++; }
  });
  return {unlocked:true, total:total, wins:wins, losses:losses, draws:draws, winRate:anRate(ms),
    r5:{wins:anWins(r5), total:r5.length, rate:anRate(r5)},
    r10:{wins:anWins(r10), total:r10.length, rate:anRate(r10)},
    avgPd: gc?pd/gc:0, team:{n:team.length, rate:anRate(team)}, indiv:{n:indiv.length, rate:anRate(indiv)},
    monthly:monthly, annual:annual, maxWin:mxW, maxLoss:mxL, curStreak:curStreak,
    weekday:{wins:wdW, total:wdT, rate:wdT?wdW/wdT*100:0}, weekend:{wins:weW, total:weT, rate:weT?weW/weT*100:0}};
}

function anLayerB(ms){
  const f = ms.filter(function(m){ return !anIsSpecial(m); });
  if (!f.length) return {unlocked:false, n:0};
  let fstW=0, fstT=0, alsW=0, alsT=0, cgW=0, cgT=0, tgW=0, tgT=0;
  let sw=0, fw=0, fl=0, sl=0, setsW=0, setsL=0, ptsW=0, ptsL=0, games=0;
  let fgW=0, fgT=0, finalC=0;
  f.forEach(function(m){
    const won = anResult(m)==='WIN', lost = anResult(m)==='LOSS';
    const ss = anScores(m);
    let myS=0, opS=0, tight=false;
    ss.forEach(function(s){
      const a=s.myScore||0, b=s.opponentScore||0;
      if (a>0||b>0){
        games++; ptsW+=a; ptsL+=b;
        if (a>b){ setsW++; myS++; } else if (b>a){ setsL++; opS++; }
        const d=Math.abs(a-b);
        if (d>=1 && d<=2){ cgT++; if (a>b) cgW++; }
        if (d===2) tight=true;
      }
    });
    if (ss.length && ((ss[0].myScore||0)>0 || (ss[0].opponentScore||0)>0)){
      fgT++;
      const a=ss[0].myScore||0, b=ss[0].opponentScore||0;
      if (a>b){ fgW++; fstT++; if (won) fstW++; }
      else if (b>a){ alsT++; if (won) alsW++; }
      if (won && opS===0 && myS>0) sw++;
      else if (won && opS>0) fw++;
      else if (lost && myS>0) fl++;
      else if (lost && myS===0 && opS>0) sl++;
      const fin = (myS===2&&opS===1)||(myS===1&&opS===2)||(myS===3&&opS===2)||(myS===2&&opS===3)||(myS===4&&opS===3)||(myS===3&&opS===4);
      if (fin) finalC++;
    }
    if (tight){ tgT++; if (won) tgW++; }
  });
  const totSets = setsW+setsL, totPts = ptsW+ptsL;
  return {unlocked:true, n:f.length,
    fst:{wins:fstW, total:fstT, rate:fstT?fstW/fstT*100:0},

function anLayerD(ms){
  if (!ms.length) return {unlocked:false, n:0};

  const totalWins = ms.filter(function(m){ return anResult(m)==='WIN'; }).length;
  let sw=0, cw=0, fgw=0, ls=0, fgl=0;
  valid.forEach(function(m){
    const ss = anScores(m);
    if (!ss.length) return;
    const a=ss[0].myScore||0, b=ss[0].opponentScore||0, r=anResult(m);
    if (a>b){ fgw++; if (r==='LOSS') ls++; }
    else if (b>a){ fgl++; if (r==='WIN') cw++; }
    if (r==='WIN' && !ss.some(function(s){ return (s.myScore||0)<(s.opponentScore||0); })) sw++;
  });
  let frW=0, frT=0, lrW=0, lrT=0, mdW=0, mdT=0;
  ms.forEach(function(m){
    const r=(m.roundName||'').trim();
    if (r==='練習会' || r.indexOf('練習')>=0) return;
    const w = anResult(m)==='WIN';
    if (r==='1回戦'||r==='初戦'||r==='予選'||r==='リーグ戦'){ frT++; if(w) frW++; }
    else if (r==='準決勝'||r==='3位決定戦'||r==='決勝'){ mdT++; if(w) mdW++; }
    else if (r){ lrT++; if(w) lrW++; }
  });
  const byDay = {};
  ms.forEach(function(m){ if (m.matchDateEpochDay>0){ (byDay[m.matchDateEpochDay]=byDay[m.matchDateEpochDay]||[]).push(m); } });
  let foW=0, foT=0, sqW=0, sqT=0;
  Object.keys(byDay).forEach(function(k){
    const ordered = byDay[k].slice().sort(function(a,b){ return (anRoundOrder(a.roundName)-anRoundOrder(b.roundName))||(a.createdAt-b.createdAt); });
    ordered.forEach(function(m, idx){
      const w = anResult(m)==='WIN';
      if (idx===0){ foT++; if(w) foW++; } else { sqT++; if(w) sqW++; }

  let tbW=0, tbT=0, dsW=0, dsT=0;
  valid.forEach(function(m){
    const ss = anScores(m);
    ss.forEach(function(s){
      const a=s.myScore||0, b=s.opponentScore||0;
      const tb = (s.tieBreakMy!=null || s.tieBreakOpponent!=null) ||
        (a===7&&b===6)||(a===6&&b===7)||((a>=11||b>=11)&&Math.abs(a-b)===2)||(a===4&&b===3)||(a===3&&b===4);
      if (tb && (a>0||b>0)){ tbT++; if (a>b) tbW++; }
    });
    if (ss.length>=3){
      let myS=0, opS=0;
      ss.forEach(function(s){ const a=s.myScore||0, b=s.opponentScore||0; if(a>b)myS++; else if(b>a)opS++; });
      if (Math.abs(myS-opS)<=1 && (myS+opS)>=3){ dsT++; if (anResult(m)==='WIN') dsW++; }
    }
  });
  const indoor = ms.filter(function(m){return m.environmentType==='INDOOR';});
  const outdoor = ms.filter(function(m){return m.environmentType==='OUTDOOR';});
  const wLabels = {SUNNY:jaEn('晴れ','Sunny'), CLOUDY:jaEn('曇り','Cloudy'), RAINY:jaEn('雨天','Rainy')};
  const byW = {};
  ms.forEach(function(m){ if (m.weatherType){ (byW[m.weatherType]=byW[m.weatherType]||[]).push(m); } });
  const weatherRates = Object.keys(byW).map(function(k){
    return {label:wLabels[k]||k, wins:anWins(byW[k]), count:byW[k].length, rate:anRate(byW[k])};
  }).sort(function(a,b){ return b.count-a.count; });
  const day = ms.filter(function(m){return m.isNightMatch===false;});
  const night = ms.filter(function(m){return m.isNightMatch===true;});
  const insights = [];
  const frRate = frT?frW/frT*100:0, lrRate = lrT?lrW/lrT*100:0, mdRate = mdT?mdW/mdT*100:0;
  const foRate = foT?foW/foT*100:0, sqRate = sqT?sqW/sqT*100:0;
  const lsRate = fgw?ls/fgw*100:0, cbRate = fgl?cw/fgl*100:0;
  if (frT>=3 && lrT>=2){
    if (frRate < lrRate-12) insights.push(tf('an_insight_first',{a:Math.round(frRate),b:Math.round(lrRate)}));
    else if (frRate>=70 && mdT>=2 && mdRate<50) insights.push(tf('an_insight_medal',{a:Math.round(mdRate)}));
  }
  if (sqT>=3 && foT>=3){
    if (sqRate < foRate-12) insights.push(tf('an_insight_stamina',{a:Math.round(foRate),b:Math.round(sqRate)}));
    else if (sqRate >= foRate+10) insights.push(tf('an_insight_engine',{a:Math.round(sqRate)}));
  }
  if (fgw>=3 && lsRate>=25) insights.push(tf('an_insight_lead',{a:Math.round(lsRate)}));
  if (fgl>=3 && cbRate>=35) insights.push(tf('an_insight_comeback',{a:Math.round(cbRate)}));
  if (!insights.length) insights.push(t('an_insight_empty'));
  return {unlocked:true, n:ms.length,
    straight:{n:sw, rate: totalWins?sw/totalWins*100:0},
    comeback:{n:cw, rate: totalWins?cw/totalWins*100:0, trueRate:cbRate},
    leadSlip:{n:ls, total:fgw, rate:lsRate}, firstLost:{n:fgl},
    first:{wins:frW, total:frT, rate:frRate}, later:{wins:lrW, total:lrT, rate:lrRate}, medal:{wins:mdW, total:mdT, rate:mdRate},
    firstDay:{wins:foW, total:foT, rate:foRate}, subseqDay:{wins:sqW, total:sqT, rate:sqRate},
    tb:{wins:tbW, total:tbT, rate:tbT?tbW/tbT*100:0}, dec:{wins:dsW, total:dsT, rate:dsT?dsW/dsT*100:0},
    indoor:{n:indoor.length, rate:anRate(indoor)}, outdoor:{n:outdoor.length, rate:anRate(outdoor)},
    weatherRates:weatherRates,
    day:{n:day.length, rate:anRate(day)}, night:{n:night.length, rate:anRate(night)},
    insights:insights};
}

function anRivals(ms){
  const byOpp = {};
  ms.forEach(function(m){ const k=m.opponentDisplayName||''; (byOpp[k]=byOpp[k]||[]).push(m); });
  const trends = Object.keys(byOpp).map(function(name){
    const list = byOpp[name].slice().sort(function(a,b){ return a.matchDateEpochDay-b.matchDateEpochDay; });
    const diffs = list.map(function(m){
      let a=0, b=0;
      anScores(m).forEach(function(s){ a+=s.myScore||0; b+=s.opponentScore||0; });
      return a-b;
    });
    const gameScores = list.map(function(m){
      let a=0, b=0;
      anScores(m).forEach(function(s){ const x=s.myScore||0, y=s.opponentScore||0; if(x>y)a++; else if(y>x)b++; });
      return a+'-'+b;
    });
    const dates = list.map(function(m){
      const d=new Date(m.matchDateEpochDay*86400000);
      return (d.getUTCFullYear()%100)+'.'+(d.getUTCMonth()+1);
    });
    let fgW=0, fgT=0, stW=0, finC=0;
    list.forEach(function(m){
      const ss=anScores(m);
      if (ss.length && ((ss[0].myScore||0)>0 || (ss[0].opponentScore||0)>0)){
        fgT++;
        const a=ss[0].myScore||0, b=ss[0].opponentScore||0;
        if (a>b) fgW++;
        let myS=0, opS=0;
        ss.forEach(function(s){ const x=s.myScore||0, y=s.opponentScore||0; if(x>y)myS++; else if(y>x)opS++; });
        if (m.isWin && opS===0 && myS>0) stW++;
        if ((myS===2&&opS===1)||(myS===1&&opS===2)||(myS===3&&opS===2)||(myS===2&&opS===3)||(myS===4&&opS===3)||(myS===3&&opS===4)) finC++;
      }
    });
    let msg=t('an_rival_once'), code='NONE';
    if (diffs.length>=2){
      const d = diffs[diffs.length-1]-diffs[diffs.length-2];
      if (d>1){ msg=t('an_rival_up'); code='UP'; }
      else if (d<-1){ msg=t('an_rival_down'); code='DOWN'; }
      else { msg=t('an_rival_stable'); code='STABLE'; }
    }
    return {name:name, count:list.length, wins:anWins(list), losses:anLosses(list), rate:anRate(list),
      diffs:diffs, gameScores:gameScores, dates:dates, msg:msg, code:code,
      fg:{wins:fgW, total:fgT, rate:fgT?fgW/fgT*100:0}, straight:{n:stW, rate:fgT?stW/fgT*100:0}, final:{n:finC, rate:fgT?finC/fgT*100:0}};
  });
  const best = trends.filter(function(x){ return x.count>=2 && x.rate>=50; }).sort(function(a,b){ return b.rate-a.rate; });
  const worst = trends.filter(function(x){ return x.count>=2 && x.rate<50; }).sort(function(a,b){ return a.rate-b.rate; });
  return {unlocked: trends.some(function(x){ return x.count>=2; }), best:best, worst:worst,
    trends: trends.filter(function(x){ return x.count>=2; }).sort(function(a,b){ return b.count-a.count; }),
    threshold:t('an_rival_threshold')};
}

function anScoreCard(ms){
  const withSheet = ms.filter(function(m){
    return anScores(m).some(function(s){ return s.pointSequence && s.pointSequence.length>0; });
  });
  if (!withSheet.length) return {unlocked:false, n:0};
  let totalGames=0, totalPoints=0;
  let myGpC=0, myGpF=0, opGpS=0, opGpF=0;
  const maxWonList=[], maxLostList=[];
  let bbC=0, totLossF=0, mrC=0, totWinF=0;
  let stW=0, stT=0, mdW=0, mdT=0, enW=0, enT=0;
  let leadT=0, leadW=0, cbT=0, cbW=0, leadingPts=0;
  withSheet.forEach(function(m){
    anScores(m).forEach(function(set){
      const points = set.pointSequence||[];
      if (!points.length) return;
      totalGames++; totalPoints+=points.length;
      const myF = points.filter(function(p){return p==='A';}).length;
      const opF = points.filter(function(p){return p==='B';}).length;
      const gameWon = myF>opF;
      const target = Math.max(myF, opF);
      let myS=0, opS=0, mxW=0, curW=0, mxL=0, curL=0;
      let hadLead2=false, hadTrail2=false;
      points.forEach(function(point, idx){
        const pn = idx+1;
        if (myS>opS) leadingPts++;
        const isMyGp = (myS===target-1) && (myS>opS);
        const isOpGp = (opS===target-1) && (opS>myS);
        if (isMyGp){ myGpF++; if (point==='A') myGpC++; }
        if (isOpGp){ opGpF++; if (point==='A') opGpS++; }
        if (myS-opS>=2) hadLead2=true;
        if (opS-myS>=2) hadTrail2=true;
        if (idx>0){
          const prev = points[idx-1];
          if (prev==='B'){ totLossF++; if (point==='A') bbC++; }
          else if (prev==='A'){ totWinF++; if (point==='A') mrC++; }
        }
        if (pn<=5){ stT++; if (point==='A') stW++; }
        else if (pn<=15){ mdT++; if (point==='A') mdW++; }
        else { enT++; if (point==='A') enW++; }
        if (point==='A'){ myS++; curW++; mxW=Math.max(mxW,curW); curL=0; }
        else { opS++; curL++; mxL=Math.max(mxL,curL); curW=0; }
      });
      maxWonList.push(mxW); maxLostList.push(mxL);
      if (hadLead2){ leadT++; if (gameWon) leadW++; }
      if (hadTrail2){ cbT++; if (gameWon) cbW++; }
    });
  });
  const avg = function(a){ return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0; };
  const gpConv = myGpF?myGpC/myGpF:0, gpSave = opGpF?opGpS/opGpF:0;
  const bb = totLossF?bbC/totLossF:0, mr = totWinF?mrC/totWinF:0;
  const stR = stT?stW/stT:0, mdR = mdT?mdW/mdT:0, enR = enT?enW/enT:0;
  const leadR = leadT?leadW/leadT:0, cbR = cbT?cbW/cbT:0;
  const dom = totalPoints?leadingPts/totalPoints:0;
  const advice = [];
  if (bb>=0.55) advice.push(tf('an_sc_bounce_hi',{a:Math.round(bb*100)}));
  else if (bb>0) advice.push(tf('an_sc_bounce_lo',{a:Math.round(bb*100)}));
  if (gpConv>=0.60) advice.push(tf('an_sc_gp_hi',{a:Math.round(gpConv*100)}));
  else if (myGpF>0) advice.push(tf('an_sc_gp_lo',{a:Math.round(gpConv*100)}));
  if (stR < mdR-0.08 || stR < enR-0.08) advice.push(tf('an_sc_slow',{a:Math.round(stR*100)}));
  else if (stR>=0.55) advice.push(tf('an_sc_fast',{a:Math.round(stR*100)}));
  if (leadR>=0.80) advice.push(tf('an_sc_lead_hi',{a:Math.round(leadR*100)}));
  else if (leadT>0) advice.push(tf('an_sc_lead_lo',{a:Math.round(leadR*100)}));
  if (cbR>=0.35) advice.push(tf('an_sc_comeback',{a:Math.round(cbR*100)}));
  if (!advice.length) advice.push(t('an_sc_empty'));
  return {unlocked:true, n:withSheet.length, games:totalGames, points:totalPoints,
    gp:{conv:gpConv, converted:myGpC, faced:myGpF, save:gpSave, saved:opGpS, oppFaced:opGpF},
    avgMaxWon:avg(maxWonList), avgMaxLost:avg(maxLostList),
    bounce:{rate:bb, n:bbC, total:totLossF}, momentum:{rate:mr, n:mrC, total:totWinF},
    start:{rate:stR, total:stT}, mid:{rate:mdR, total:mdT}, end:{rate:enR, total:enT},
    lead:{rate:leadR, won:leadW, total:leadT}, comeback:{rate:cbR, won:cbW, total:cbT},
    dominance:dom, advice:advice};
}

function anPeriodBounds(){
  const now = new Date();
  if (state.analyticsPeriod==='month') return dateToEpochDay(new Date(now.getFullYear(), now.getMonth(), 1));
  if (state.analyticsPeriod==='3m') return dateToEpochDay(new Date(now.getFullYear(), now.getMonth()-2, 1));
  if (state.analyticsPeriod==='year') return dateToEpochDay(new Date(now.getFullYear(), 0, 1));
  return null;
}
function anPeriodMatches(){
  const ms = playerMatches();
  const from = anPeriodBounds();
  if (from==null) return ms;
  return ms.filter(function(m){ return m.matchDateEpochDay>=from; });
}
function setAnPeriod(p){ state.analyticsPeriod=p; render(); }
function setIgMode(m){ state.igMode=m; render(); }

/* ---- Instagram画像（Canvas 1080×1080。選手名のみ表示） ---- */
function igDraw(){
  const cv = document.getElementById('ig-canvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const W=1080, H=1080;
  const p = currentPlayer();
  const ms = anPeriodMatches();
  const A = anLayerA(ms);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0C3E63'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#FABE0F'; ctx.fillRect(0,0,W,24); ctx.fillRect(0,H-24,W,24);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const font = '-apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '800 58px '+font;
  ctx.fillText('SmashStats', 80, 120);
  ctx.fillStyle = '#FABE0F';
  ctx.font = '700 44px '+font;
  ctx.fillText(p?p.playerName:'', 80, 200);
  const periodLabel = {month:t('an_month'), '3m':t('an_3m'), year:t('an_year'), all:t('an_all')}[state.analyticsPeriod]||'';
  ctx.fillStyle = '#CFE0EC';
  ctx.font = '400 34px '+font;
  ctx.fillText(periodLabel+' / '+(p?sportLabel(p.sportType):''), 80, 250);
  if (!A.unlocked){
    ctx.fillStyle = '#FFFFFF'; ctx.font = '700 52px '+font;
    ctx.fillText(t('an_no_data'), 80, 560);
  } else if (state.igMode==='monthly'){
    ctx.fillStyle = '#FFFFFF'; ctx.font = '800 64px '+font;
    ctx.fillText(t('monthly_win_rate'), 80, 380);
    const months = A.monthly.slice(-6);
    const barW = 120, gap = 46, baseY = 900, maxH = 380;
    months.forEach(function(m, i){
      const x = 80 + i*(barW+gap);
      const hh = Math.round(maxH * m.rate/100);
      ctx.fillStyle = '#FABE0F';
      ctx.fillRect(x, baseY-hh, barW, hh);
      ctx.fillStyle = '#FFFFFF'; ctx.textAlign='center';
      ctx.font = '700 34px '+font;
      ctx.fillText(Math.round(m.rate)+'%', x+barW/2, baseY-hh-16);
      ctx.font = '400 30px '+font;
      ctx.fillStyle = '#CFE0EC';
      ctx.fillText(m.label, x+barW/2, baseY+48);
      ctx.textAlign='left';
    });
  } else {
    ctx.fillStyle = '#FFFFFF'; ctx.font = '800 200px '+font;
    ctx.fillText(pct0(A.winRate), 80, 480);
    ctx.font = '700 44px '+font;
    ctx.fillStyle = '#FABE0F';
    ctx.fillText(t('win_rate'), 80, 550);
    ctx.fillStyle = '#FFFFFF'; ctx.font = '400 40px '+font;
    ctx.fillText(t('total_matches')+': '+A.total+'  '+t('wins')+': '+A.wins+'  '+t('losses')+': '+A.losses, 80, 660);
    const streak = A.curStreak.type==='WIN'?A.curStreak.n+jaEn('連勝','-win streak'):A.curStreak.type==='LOSS'?A.curStreak.n+jaEn('連敗','-loss streak'):'—';
    ctx.fillText(jaEn('最大連勝 ','Longest win streak ')+A.maxWin+' / '+t('an_current_streak')+': '+streak, 80, 730);
    ctx.fillText(jaEn('直近5試合 ','Last 5 matches: ')+A.r5.wins+jaEn('勝',' W - ')+(A.r5.total-A.r5.wins)+jaEn('敗',' L'), 80, 800);
  }
  ctx.fillStyle = '#8FB0C7'; ctx.font = '400 30px '+font;
  ctx.fillText('SmashStats Web', 80, H-60);
}
function igDownload(){
  const cv = document.getElementById('ig-canvas');
  if (!cv) return;
  const a = document.createElement('a');
  const d = new Date();
  a.href = cv.toDataURL('image/png');
  a.download = 'smashstats_' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.png';
  document.body.appendChild(a); a.click();

function aiBuild(kind){
  const p = currentPlayer();
  const ms = anPeriodMatches();
  const A = anLayerA(ms), B = anLayerB(ms), C = anLayerC(ms, state.gears), D = anLayerD(ms), E = anLayerE(ms);
  const periodLabel = {month:t('an_month'), '3m':t('an_3m'), year:t('an_year'), all:t('an_all')}[state.analyticsPeriod]||'';
  const L = [];
  const name = p?p.playerName:'';
  if (kind==='issues'){
    L.push(t('ai_p_issues_title'));
    L.push(t('ai_p_issues_body'));
  } else if (kind==='tactics'){
    L.push(t('ai_p_tactics_title'));
    L.push(t('ai_p_tactics_body'));
  } else {
    L.push(t('ai_p_image_title'));
    L.push(t('ai_p_image_body'));
  }
  L.push('');
  L.push(tf('ai_p_player',{name:name,sport:(p?sportLabel(p.sportType):''),period:periodLabel}));
  if (!A.unlocked){ L.push(t('ai_p_no_data')); return L.join('\n'); }
  L.push(tf('ai_p_total',{total:A.total,wins:A.wins,losses:A.losses,rate:pct1(A.winRate)}));
  L.push(tf('ai_p_recent5',{w:A.r5.wins,l:(A.r5.total-A.r5.wins),rate:pct1(A.r5.rate)}));
  const curStreakTxt = A.curStreak.type==='WIN'?A.curStreak.n+jaEn('連勝','-win streak'):A.curStreak.type==='LOSS'?A.curStreak.n+jaEn('連敗','-loss streak'):'—';
  L.push(tf('ai_p_streak',{a:A.maxWin,b:A.maxLoss,c:curStreakTxt}));
  L.push(t('ai_p_monthly')+A.monthly.map(function(m){ return m.label+' '+pct1(m.rate)+jaEn('（',' (')+m.wins+'/'+m.total+jaEn('）',')'); }).join(jaEn('、',', ')));
  if (B.unlocked){
    L.push(tf('ai_p_sets',{a:pct1(B.sets.rate),b:pct1(B.points.rate)}));
    L.push(tf('ai_p_fst',{a:pct1(B.fst.rate),w:B.fst.wins,t:B.fst.total}));
    L.push(tf('ai_p_als',{a:pct1(B.als.rate),w:B.als.wins,t:B.als.total}));
  }
  if (C.unlocked){
    L.push(t('ai_p_surf')+C.surfRates.map(function(s){ return s.surface+' '+pct1(s.rate)+jaEn('（',' (')+s.count+jaEn('試合）',' matches)'); }).join(jaEn('、',', ')));
    if (C.gearRates.length) L.push(t('ai_p_gear')+C.gearRates.map(function(g){ return g.label+' '+pct1(g.rate)+jaEn('（',' (')+g.count+jaEn('試合）',' matches)'); }).join(jaEn('、',', ')));
  }
  if (D.unlocked){
    L.push(t('ai_p_insights'));
    D.insights.forEach(function(s){ L.push('- '+s); });
  }
  if (E.clubs.length) L.push(t('ai_p_clubs')+E.clubs.slice(0,3).map(function(c){ return c.club+' '+pct1(c.rate)+jaEn('（',' (')+c.wins+jaEn('勝',' W - ')+c.losses+jaEn('敗',' L')+jaEn('）',')'); }).join(jaEn('、',', ')));
  if (E.partners.length) L.push(t('ai_p_partners')+E.partners.map(function(x){ return x.partner+' '+pct1(x.rate)+jaEn('（',' (')+x.count+jaEn('試合）',' matches)'); }).join(jaEn('、',', ')));
  const mom = [];
  ms.forEach(function(m){ anScores(m).forEach(function(s){ if (s.lostInitiativeScore||s.gainedInitiativeScore) mom.push(s); }); });
  if (mom.length) L.push(tf('ai_p_momentum',{n:mom.length}));
  const recent = ms.slice().sort(function(a,b){ return (b.matchDateEpochDay-a.matchDateEpochDay)||(b.createdAt-a.createdAt); }).slice(0,5);
  if (recent.length){
    L.push(t('ai_p_recent'));
    recent.forEach(function(m){ L.push('- '+fmtDate(m.matchDateEpochDay)+' vs '+m.opponentDisplayName+' '+scoreText(anScores(m))+' '+(anResult(m)==='WIN'?jaEn('勝ち','Win'):anResult(m)==='LOSS'?jaEn('負け','Loss'):jaEn('引き分け','Draw'))); });
  }
  return L.join('\n');
}

    navigator.clipboard.writeText(text).then(function(){ toast(t('ai_copied')); }, function(){ aiCopyFallback(text); });

/* ---- CSV取り込み（Android版と同じ10列） ---- */
function zenToHan(s){
  return String(s||'').replace(/[０-９Ａ-Ｚａ-ｚ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); })
    .replace(/，/g, ',').replace(/／/g, '/').replace(/－/g, '-').replace(/　/g, ' ').replace(/．/g, '.');
}
function csvParse(text){
  const rows=[]; let row=[], field='', inQ=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (inQ){
      if (c==='"'){
        if (text[i+1]==='"'){ field+='"'; i++; }
        else inQ=false;
      } else field+=c;
    } else if (c==='"'){ inQ=true; }
    else if (c===','){ row.push(field); field=''; }
    else if (c==='\n'){ row.push(field); field=''; rows.push(row); row=[]; }
    else if (c==='\r'){ /* skip */ }
    else field+=c;
  }
  if (field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function csvDateToEpoch(s){
  s = zenToHan(s).trim();
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (m) return dateInputToEpochDay(m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'));
  m = s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
  if (m) return dateInputToEpochDay(m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'));
  return null;
}
function csvSport(s){
  const map = {'バドミントン':'BADMINTON','テニス':'TENNIS','ソフトテニス':'SOFT_TENNIS','卓球':'TABLE_TENNIS','ピックルボール':'PICKLEBALL'};
  if (map[s]) return map[s];
  if (SPORTS.indexOf(s)>=0) return s;
  return null;
}
function csvScoreSets(s){
  const sets = [];
  if (!s) return sets;
  s.split(/[,、]/).forEach(function(p){
    const m = p.trim().match(/(\d+)\s*[-－]\s*(\d+)(?:\s*\((\d+)\s*[-－]\s*(\d+)\))?/);
    if (m) sets.push({myScore:parseInt(m[1],10), opponentScore:parseInt(m[2],10),
      tieBreakMy: m[3]!=null?parseInt(m[3],10):null, tieBreakOpponent: m[4]!=null?parseInt(m[4],10):null,
      specialResult:null, lostInitiativeScore:null, gainedInitiativeScore:null, momentumDetail:null, pointSequence:null});
  });
  return sets;
}
async function csvImportFile(file){
  try{
    const text = await file.text();
    const rows = csvParse(text);
    if (rows.length<2) throw new Error('csv');
    const p = currentPlayer();
    if (!p){ proNotice(t('need_player')); return; }
    const existing = playerMatches();
    const seen = {};
    existing.forEach(function(m){ seen[m.matchDateEpochDay+'|'+(m.opponentDisplayName||'')+'|'+m.scoresJson]=1; });
    const parsed = [];
    let dup=0, bad=0;
    for (let i=1;i<rows.length;i++){
      const r = rows[i];
      if (!r || r.every(function(c){ return String(c||'').trim()===''; })) continue;
      const get = function(k){ return zenToHan(r[k]||'').trim(); };
      const ed = csvDateToEpoch(get(0));
      if (ed==null || !get(3)){ bad++; continue; }
      const sport = csvSport(get(1)) || p.sportType;
      const sets = csvScoreSets(get(5));
      const scoresJson = JSON.stringify(sets);
      const key = ed+'|'+get(3)+'|'+scoresJson;
      if (seen[key]){ dup++; continue; }
      seen[key]=1;
      let isWin = null;
      const res = get(6);
      if (/勝|WIN/i.test(res)) isWin=true; else if (/負|敗|LOSS/i.test(res)) isWin=false;
      const m = { matchId:uuid(), playerId:p.playerId, sportType:sport,
        matchType:(/ダブルス|DOUBLES/i.test(get(2))?'DOUBLES':'SINGLES'),
        playerTeamNameSnapshot:p.defaultTeamName||null, partnerName:get(4)||null,
        opponentDisplayName:get(3), opponentMembersJson:JSON.stringify([get(3)]),
        opponentTeamNameSnapshot:null, courtSurface:'UNKNOWN', environmentType:'INDOOR',
        gearId:null, tournamentName:get(7)||'', tournamentYear: new Date(ed*86400000).getUTCFullYear(),
        matchDateEpochDay:ed, finalResultCode:'NORMAL', roundName:get(8)||null,
        tournamentDivision:null, tournamentFormat:null, scoresJson:scoresJson, isWin:false,
        videoPathOrUrl:null, matchNote:get(9)||null, photoPath:null, isTeamMatch:false,
        teamMyScore:null, teamOpponentScore:null, weatherType:null, ballOrShuttle:null,
        isNightMatch:false, venueId:null, elapsedDaysFromMaintenance:null,
        cumulativeMatchesFromMaintenance:null, createdAt:Date.now(), updatedAt:Date.now(), isDeleted:false, deletedAt:null };
      deriveMatch(m);
      if (isWin!==null) m.isWin = isWin;
      parsed.push(m);
    }
    if (!parsed.length){ proNotice(dup? (t('csv_imported')+' 0 / '+t('csv_dup')+' '+dup) : t('csv_error')); return; }
    let allowed = parsed, limited = 0;
    if (!state.isPro){
      const room = Math.max(0, 5 - monthMatchCount(p.playerId));
      if (parsed.length > room){ limited = parsed.length - room; allowed = parsed.slice(0, room); }
    }
    if (!allowed.length){ proNotice(t('free_limit_match')); return; }
    for (const m of allowed) await idbPut('matches', m);
    await loadAll();
    toast(t('csv_imported')+' '+allowed.length+' / '+t('csv_dup')+' '+dup+(limited?' / '+t('csv_limit')+' '+limited:''));
    render();
  }catch(e){ proNotice(t('csv_error')); }
}

/* ---- JSON書き出し・取り込み（Android版と同じキー名） ---- */
async function exportJSON(){
  const data = {
    players: await idbAll('players'),
    gears: await idbAll('gears'),
    matches: await idbAll('matches'),
    maintenances: await idbAll('gear_maintenances'),
    venues: await idbAll('venues'),
    opponentProfiles: await idbAll('opponent_profiles'),
    opponentCustomItems: await idbAll('opponent_custom_items'),
    focuses: await idbAll('focuses'),
    notes: await idbAll('notes')
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = 'smashstats_backup_' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(t('export_done'));
}
async function importJSONFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const map = {players:'players', gears:'gears', matches:'matches', maintenances:'gear_maintenances',
      venues:'venues', opponentProfiles:'opponent_profiles', opponentCustomItems:'opponent_custom_items',
      focuses:'focuses', notes:'notes'};
    for (const k of Object.keys(map)){
      const arr = data[k];
      if (!Array.isArray(arr)) continue;
      for (const row of arr){
        if (k==='matches') deriveMatch(row);
        await idbPut(map[k], row);
      }
    }
    await loadAll(); toast(t('imported')); render();
  }catch(e){ proNotice(t('import_error')); }
}

function bindGlobal(){
  $all('#tabbar button').forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.dataset.tab); });
  });
  $('#btn-settings').addEventListener('click', function(){ state.view='settings'; render(); });
  const sel = $('#player-select');
  sel.addEventListener('change', function(){
    if (sel.value==='__add__'){ showPlayerForm(); renderPlayerSelect(); return; }
    state.currentPlayerId = sel.value;
    localStorage.setItem('ss-player', sel.value);
    render();
  });
  document.addEventListener('click', function(e){
    if (e.target && e.target.id==='import-file') return;
    const f = $('#import-file');
    if (f) f.onchange = function(){ if(f.files && f.files[0]) importJSONFile(f.files[0]); f.value=''; };
    if (e.target && e.target.id==='import-csv-file') return;
    const cf = $('#import-csv-file');
    if (cf) cf.onchange = function(){ if(cf.files && cf.files[0]) csvImportFile(cf.files[0]); cf.value=''; };
  });
  // キーボード表示時は下部タブを隠す（入力欄にフォーカスしている間だけ）
  document.addEventListener('focusin', function(e){
    const tag = (e.target.tagName||'').toLowerCase();
    if (tag==='input' || tag==='textarea' || tag==='select') document.body.classList.add('kb');
  });
  document.addEventListener('focusout', function(){
    setTimeout(function(){ document.body.classList.remove('kb'); }, 150);
  });
  document.addEventListener('click', function(e){
    if (e.target && e.target.id==='overlay' ) closeOverlay();
  });
}
async function init(){
  bindGlobal();

    if (navigator.storage && navigator.storage.persist){
      state.persisted = await navigator.storage.persist();

  await loadAll();
  await metaSet('schemaVersion', 16);

  licenseReverifySilent().catch(function(){});

  if (syncConfigured() && navigator.onLine !== false){
    syncNow({auto:true, silent:true}).catch(function(){ /* 状態は設定画面に残る */ });
  }
  if ('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* オフライン時は無視 */ });
  }
}

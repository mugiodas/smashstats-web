<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C3E63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SmashStats">
<title>SmashStats</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ---- theme variables ---- */
:root{
  --navy:#0C3E63; --navy-dark:#0F1E36; --gold:#FABE0F; --rose:#C2486B;
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-muted:#E9EEF1; --text:#16222B;
  --muted:#5B6B76; --border:#D3DCE1; --accent:#0C3E63; --danger:#B3261E;
  --win:#1B7A3D; --loss:#B3261E; --tabbar-h:64px;
}
[data-theme="mint_pale"]{
  --navy:#2F6B5E; --navy-dark:#234F46; --gold:#E8B64C; --rose:#C2486B;
  --bg:#EFF7F3; --surface:#FFFFFF; --surface-muted:#DCEDE6; --text:#1C2B27;
  --muted:#5A7268; --border:#C4D8CE; --accent:#2F6B5E; --danger:#B3261E;
  --win:#1B7A3D; --loss:#B3261E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  padding-top:env(safe-area-inset-top);
}
#app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg);
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);}
body.kb #tabbar{display:none;}
body.kb #app{padding-bottom:12px;}
header{
  position:sticky; top:0; z-index:20;
  background:var(--navy); color:#fff;
  padding:10px 14px calc(10px + env(safe-area-inset-top)*0);
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:10px;
}
header h1{font-size:19px; margin:0; letter-spacing:.5px; white-space:nowrap;}
header h1 .gold{color:var(--gold);}
header .spacer{flex:1;}
header select{
  max-width:150px; font-size:15px; padding:8px 6px; border-radius:8px;
  border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.12); color:#fff;
}
header select option{color:#16222B;}
.icon-btn{
  min-width:44px; min-height:44px; border-radius:10px; border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.12); color:#fff; font-size:20px; cursor:pointer;
}
#install-banner{
  display:none; margin:10px 12px 0; padding:12px; border-radius:12px;
  background:#FFF7D6; border:1px solid var(--gold); color:#5A4300; font-size:14px;
}
#install-banner.show{display:block;}
#install-banner button{margin-top:8px;}
main{padding:12px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-bottom:12px;
}
.card h2{font-size:17px; margin:0 0 8px;}
.card h3{font-size:15px; margin:14px 0 6px;}
.muted{color:var(--muted); font-size:14px;}
.small{font-size:13px;}
.badge{
  display:inline-block; padding:2px 9px; border-radius:999px; font-size:13px; font-weight:700;
  white-space:nowrap; flex-shrink:0;
}
.badge.win{background:#DDF2E3; color:var(--win);}
.badge.loss{background:#FBE3E1; color:var(--loss);}
.badge.draw{background:#E9EEF1; color:var(--muted);}
.badge.pro{background:var(--gold); color:#4A3600;}
.badge.free{background:var(--surface-muted); color:var(--muted);}
.badge.demo{background:#F3D9E2; color:var(--rose);}
.badge.sync{background:#E3ECF5; color:var(--navy);}
button, .btn{
  font-size:16px; min-height:48px; padding:10px 16px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  cursor:pointer; font-family:inherit;
}
button.primary, .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
button.danger{background:#fff; border-color:var(--danger); color:var(--danger);}
button.gold{background:var(--gold); border-color:var(--gold); color:#4A3600; font-weight:700;}
button:disabled{opacity:.45; cursor:default;}
button.block{width:100%;}
label{display:block; font-size:14px; font-weight:700; margin:12px 0 4px;}
input, select, textarea{
  width:100%; font-size:16px; padding:11px 10px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  font-family:inherit;
}
input[type="date"]{min-height:48px;}
textarea{min-height:76px; resize:vertical;}
.row{display:flex; gap:8px; align-items:center;}
.row>*{flex:1;}
.row .narrow{flex:0 0 auto;}
.set-row{
  border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:10px;
  background:var(--surface-muted);
}
.set-row .set-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.set-row .set-head b{font-size:15px;}
.match-card{cursor:pointer;}
.match-card .top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.match-card .opp{font-size:17px; font-weight:700;}
.match-card .score{font-size:17px; font-weight:700; white-space:nowrap;}
.match-card .sub{font-size:14px; color:var(--muted); margin-top:4px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center;}
.stat-grid .stat{background:var(--surface-muted); border-radius:12px; padding:10px 4px;}
.stat-grid .num{font-size:22px; font-weight:800;}
.stat-grid .lbl{font-size:12px; color:var(--muted);}
.bar-row{display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0;}
.bar-row .bar-label{flex:0 0 92px;}
.bar-row .bar-track{flex:1; height:10px; background:var(--surface-muted); border-radius:6px; overflow:hidden;}
.bar-row .bar-fill{height:100%; background:var(--accent);}
.bar-row .bar-val{flex:0 0 52px; text-align:right;}
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar .tabs{max-width:480px; margin:0 auto; display:flex;}
#tabbar button{
  flex:1; border:none; background:none; border-radius:0; min-height:var(--tabbar-h);
  padding:6px 0 8px; font-size:12px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
#tabbar button .ic{font-size:22px; line-height:1;}
#tabbar button.active{color:var(--accent); font-weight:700;}
#tabbar button.active .ic{color:var(--accent);}
#overlay{
  display:none; position:fixed; inset:0; z-index:50; background:rgba(10,25,35,.55);
  align-items:flex-end; justify-content:center;
}
#overlay.show{display:flex;}
#overlay .sheet{
  width:100%; max-width:480px; max-height:86vh; overflow:auto;
  background:var(--surface); border-radius:18px 18px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
}
#overlay .sheet h2{margin-top:0;}
.point-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0;}
.point-btns button{min-height:72px; font-size:20px; font-weight:800;}
.score-big{font-size:34px; font-weight:800; text-align:center; margin:8px 0;}
.notice{
  border-radius:12px; padding:12px; margin-bottom:12px; font-size:15px;
  background:#FFF7D6; border:1px solid var(--gold);
}
.notice.info{background:#E3ECF5; border-color:#9DB8D2;}
.notice.error{background:#FBE3E1; border-color:#E0A49F;}
.empty{padding:22px 10px; text-align:center; color:var(--muted);}
.divider{height:1px; background:var(--border); margin:14px 0;}
.kv{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--surface-muted); font-size:15px;}
.kv:last-child{border-bottom:none;}
.kv b{text-align:right;}
.tabs-inline{display:flex; gap:8px; margin-bottom:12px;}
.tabs-inline button{flex:1; min-height:44px; font-size:15px;}
.tabs-inline button.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}
@media (max-width:360px){ header h1{font-size:17px;} }
</style>
</head>
<body data-theme="standard">
<div id="app">
  <header>
    <h1>Smash<span class="gold">Stats</span></h1>
    <div class="spacer"></div>
    <select id="player-select" aria-label="選手切替"></select>
    <button class="icon-btn" id="btn-settings" aria-label="設定">⚙️</button>
  </header>
  <div id="install-banner"></div>
  <main id="view"></main>
  <nav id="tabbar" aria-label="タブ">
    <div class="tabs">
      <button data-tab="home"><span class="ic">🏠</span><span data-i18n="tab_home">ホーム</span></button>
      <button data-tab="matches"><span class="ic">🎾</span><span data-i18n="tab_matches">試合</span></button>
      <button data-tab="register"><span class="ic">✏️</span><span data-i18n="tab_register">登録</span></button>
      <button data-tab="analytics"><span class="ic">📊</span><span data-i18n="tab_analytics">分析</span></button>
      <button data-tab="gear"><span class="ic">🏸</span><span data-i18n="tab_gear">用具</span></button>
    </div>
  </nav>
</div>
<div id="overlay"><div class="sheet" id="overlay-sheet"></div></div>

/* =====================================================================
   競技別スコア計算（純粋関数。UI・勝敗判定・分析の共通ロジック）
   ScoreSheetModels.kt の calculateGameProgress 相当を移植。
   ===================================================================== */
function rallyTarget(sport){
  if (sport==='BADMINTON') return 21;
  if (sport==='TABLE_TENNIS' || sport==='PICKLEBALL') return 11;
  return 21;
}
function isRallySport(sport){ return sport==='BADMINTON'||sport==='TABLE_TENNIS'||sport==='PICKLEBALL'; }

/* 1ゲーム分のポイント列 ["A","B",...] から進行状態を計算する */
function calcGameProgress(sport, initialServer, points){
  let a=0, b=0, server=initialServer||'A';
  let gamesA=0, gamesB=0, rallyA=0, rallyB=0;
  let tieA=null, tieB=null, isTiebreak=false, gameOver=false;
  const tennis = (sport==='TENNIS' || sport==='SOFT_TENNIS');
  const target = rallyTarget(sport);
  const cap = sport==='BADMINTON' ? 30 : null;

  function rallyDone(x, y){
    if (cap!=null && (x===cap || y===cap)) return true;
    return (x>=target && (x-y)>=2) || (y>=target && (y-x)>=2);
  }
  for (const w of points){
    if (gameOver) break;
    if (tennis){
      const tb = (sport==='TENNIS' && gamesA===6 && gamesB===6) ||
                 (sport==='SOFT_TENNIS' && gamesA===3 && gamesB===3);
      isTiebreak = tb;
      if (w==='A') rallyA++; else rallyB++;
      if (tb){
        tieA=rallyA; tieB=rallyB;
        if ((rallyA>=7 && rallyA-rallyB>=2) || (rallyB>=7 && rallyB-rallyA>=2)){
          if (rallyA>rallyB) gamesA++; else gamesB++;
          rallyA=0; rallyB=0; gameOver=true;
        }
      } else {
        if ((rallyA>=4 && rallyA-rallyB>=2) || (rallyB>=4 && rallyB-rallyA>=2)){
          if (rallyA>rallyB) gamesA++; else gamesB++;
          rallyA=0; rallyB=0; server = (server==='A')?'B':'A';
        }
      }
    } else {
      if (w==='A') a++; else b++;
      if (w!==server) server = w; // ラリー競技: レシーバーが取ればサーブ権が移る（簡易）
      if (rallyDone(a,b)) gameOver=true;
    }
  }
  const rallyLabel = tennis ? tennisPointLabel(rallyA, rallyB) : null;
  return {
    scoreA: tennis?gamesA:a, scoreB: tennis?gamesB:b,
    rallyDisplayA: tennis?rallyLabel.a:String(a), rallyDisplayB: tennis?rallyLabel.b:String(b),
    currentServer: server, isGameOver: gameOver,
    tennisGamesScoreA: gamesA, tennisGamesScoreB: gamesB,
    tennisCurrentRallyA: rallyA, tennisCurrentRallyB: rallyB,
    isTennisTiebreak: isTiebreak, tieBreakScoreA: tieA, tieBreakScoreB: tieB,
    isChangeEndsNeeded: false,
    consecutivePointsA: streak(points,'A'), consecutivePointsB: streak(points,'B')
  };
}
function streak(points, who){
  let n=0;
  for (let i=points.length-1;i>=0;i--){ if(points[i]===who) n++; else break; }
  return n;
}
function tennisPointLabel(a, b){
  const names=['0','15','30','40'];
  if (a>=3 && b>=3){
    if (a===b) return {a:'40', b:'40'};
    if (a===b+1) return {a:'AD', b:'40'};
    if (b===a+1) return {a:'40', b:'AD'};
  }
  return {a:names[Math.min(a,3)], b:names[Math.min(b,3)]};
}

/* セット列から勝敗を判定する（Android版 getIndividualResultType 相当） */
function decideWinner(sets, sport){
  if (!sets || sets.length===0) return {result:'DRAW', mySets:0, oppSets:0, finalResultCode:'NORMAL'};
  for (const s of sets){
    if (s.specialResult==='RET') return {result:'LOSS', mySets:0, oppSets:0, finalResultCode:'RET'};
    if (s.specialResult==='WO') return {result:'WIN', mySets:0, oppSets:0, finalResultCode:'WO'};
    if (s.specialResult==='DEF') return {result:'LOSS', mySets:0, oppSets:0, finalResultCode:'DEF'};
  }
  let mySets=0, oppSets=0;
  for (const s of sets){
    const my = (s.myScore==null?0:s.myScore), op=(s.opponentScore==null?0:s.opponentScore);
    if (my===0 && op===0) continue;
    if (my===op){
      // 同点セットはタイブレークがある場合のみ判定し、なければ引き分け扱いで数えない
      if (s.tieBreakMy!=null && s.tieBreakOpponent!=null){
        if (s.tieBreakMy>s.tieBreakOpponent) mySets++; else if (s.tieBreakOpponent>s.tieBreakMy) oppSets++;
      }
      continue;
    }
    if (my>op) mySets++; else oppSets++;
  }
  const result = mySets>oppSets?'WIN':(oppSets>mySets?'LOSS':'DRAW');
  return {result, mySets, oppSets, finalResultCode:'NORMAL'};
}
/* 試合保存時に派生値を再計算する（isWin / finalResultCode） */
function deriveMatch(m){
  const sets = parseScoresJson(m.scoresJson);
  const d = decideWinner(sets, m.sportType);
  m.isWin = (d.result==='WIN');
  m.finalResultCode = d.finalResultCode;
  return m;
}

/* =====================================================================
   IndexedDB（DB名 smashstats-web）— 生の IndexedDB API のみで実装
   ===================================================================== */
const DB_NAME='smashstats-web', DB_VERSION=1;
const STORES=[
  {name:'players', key:'playerId'},
  {name:'matches', key:'matchId'},
  {name:'gears', key:'gearId'},
  {name:'gear_maintenances', key:'maintenanceId'},
  {name:'venues', key:'id', auto:true},
  {name:'opponent_profiles', key:'opponentId'},
  {name:'opponent_custom_items', key:'id'},
  {name:'focuses', key:'focusId'},
  {name:'notes', key:'noteId'},
  {name:'_outbox', key:'outboxId', auto:true},
  {name:'_meta', key:'key'}
];
let dbPromise=null;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function(resolve, reject){
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(){
      const db = req.result;
      for (const s of STORES){
        if (db.objectStoreNames.contains(s.name)) continue;
        db.createObjectStore(s.name, s.auto?{keyPath:s.key, autoIncrement:true}:{keyPath:s.key});
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return dbPromise;
}
function idbTx(storeNames, mode, fn){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(storeNames, mode);
      const out = fn(tx);
      tx.oncomplete = function(){ resolve(out && out.value!==undefined?out.value:out); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error||new Error('tx aborted')); };
    });
  });
}
function idbPut(store, value){
  return idbTx([store,'_outbox'], 'readwrite', function(tx){
    const req = tx.objectStore(store).put(value);
    const holder = {};
    req.onsuccess = function(){ holder.value = req.result; };
    if (store!=='_outbox' && store!=='_meta'){
      const key = value[STORES.find(function(s){return s.name===store;}).key];
      tx.objectStore('_outbox').add({
        table:store, rowId:String(key), op:'upsert',
        payload:JSON.stringify(value), createdAt:Date.now(), tryCount:0, lastError:null
      });
    }
    return holder;
  });
}
function idbDelete(store, key){
  return idbTx([store,'_outbox'], 'readwrite', function(tx){
    const req = tx.objectStore(store).delete(key);
    const holder = {};
    req.onsuccess = function(){ holder.value = true; };
    tx.objectStore('_outbox').add({
      table:store, rowId:String(key), op:'delete',
      payload:'', createdAt:Date.now(), tryCount:0, lastError:null
    });
    return holder;
  });
}
function idbGet(store, key){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const req = db.transaction(store,'readonly').objectStore(store).get(key);
      req.onsuccess = function(){ resolve(req.result||null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbAll(store){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const req = db.transaction(store,'readonly').objectStore(store).getAll();
      req.onsuccess = function(){ resolve(req.result||[]); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbClear(store){
  return idbTx([store], 'readwrite', function(tx){ tx.objectStore(store).clear(); return {}; });
}
function metaGet(key){ return idbGet('_meta', key).then(function(r){ return r?r.value:null; }); }
function metaSet(key, value){ return idbPut('_meta', {key:key, value:value}); }

/* _outbox を経由しない生の読み書き（同期エンジン用）。
   サーバーから受け取った行をそのまま入れる・outboxの掃除に使う。
   idbPut/idbDelete は使うと新たに outbox へ積んでしまうため、同期では使わない。 */
function idbRawPut(store, value){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).put(value);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbRawDelete(store, key){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).delete(key);
      req.onsuccess = function(){ resolve(true); };
      req.onerror = function(){ reject(req.error); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

/* =====================================================================
   同期エンジン（Phase 2: 共通Apps Scriptブリッジ）
   書き込みは常に IndexedDB が先。_outbox に溜めた変更を push し、
   pull でシート側の行を updatedAt 比較で取り込む。競合は最終書き込み勝ち。
   設計書 DESIGN.md §5・付録A、Code.gs（apps-script/）と対になる実装。
   ===================================================================== */
const SYNC_TABLES = ['players','matches','gears','gear_maintenances','venues','opponent_profiles','opponent_custom_items','focuses','notes'];
const SYNC_ID_FIELD = {players:'playerId', matches:'matchId', gears:'gearId', gear_maintenances:'maintenanceId', venues:'id', opponent_profiles:'opponentId', opponent_custom_items:'id', focuses:'focusId', notes:'noteId'};
const SYNC_HAS_UPDATED_AT = {players:true, matches:true, gears:true, gear_maintenances:false, venues:true, opponent_profiles:true, opponent_custom_items:false, focuses:true, notes:true};
const SYNC_PUSH_CHUNK = 300; // 1回の push に入れる行数
const SYNC_PULL_LIMIT = 2000; // 1回の pull で受け取る行数（テーブルごと）
const SYNC_CALL_TIMEOUT_MS = 60000; // ブリッジ1回あたりの待ち上限。超えたら打ち切って分かりやすいエラーを出す。

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function extractSpreadsheetId(input){
  if (!input) return null;
  const s = String(input).trim();
  const m = s.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9-_]{20,}$/.test(s)) return s;
  return null;
}

/* ブリッジURLは https が原則。http はローカル検証用（127.0.0.1 / localhost）のみ許可。 */
function isBridgeUrlOk(url){
  if (!url) return false;
  if (url.indexOf('https://')===0) return true;
  return url.indexOf('http://127.0.0.1')===0 || url.indexOf('http://localhost')===0;
}
function syncConfigured(){
  const s = state.sync;
  return !!(s.bridgeUrl && isBridgeUrlOk(s.bridgeUrl) && s.spreadsheetId && s.secret);
}

/* 設定欄の入力値を読み、_meta へ保存する。空の合言葉欄は「現状維持」とする。 */

/* ブリッジ呼び出し。Apps Script は Content-Type: text/plain で送ると
   プリフライト無しで呼べる。応答は常に JSON {ok:true/false,...}。
   60秒応答がなければ打ち切る（Apps Script のリダイレクト経由は遅く、
   無期限に待つと「ボタンが効かない」ように見えるため）。 */
async function syncCall(action, body){
  const payload = Object.assign({action:action, secret:state.sync.secret}, body||{});
  let res;
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, SYNC_CALL_TIMEOUT_MS) : null;
  try {
    res = await fetch(state.sync.bridgeUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch (e){
    if (e && e.name === 'AbortError'){
      const err = new Error('timeout');
      err.isTimeout = true;
      throw err;
    }
    const err = new Error('network_error');
    err.isNetwork = true;
    throw err;
  } finally {
    if (timer) clearTimeout(timer);
  }
  let data = null;
  try { data = await res.json(); } catch (e){ throw new Error('bad_response'); }
  if (!data || data.ok !== true){
    const err = new Error((data && data.message) || (data && data.error) || 'bridge_error');
    err.data = data;
    err.status = res.status;
    throw err;
  }
  return data;
}

/* 429 / LOCKED 時は1分待って指数バックオフで再試行する（最大3回）。 */
async function syncCallWithRetry(action, body){
  let delay = 60000;
  for (let attempt=0; attempt<4; attempt++){
    try {
      return await syncCall(action, body);
    } catch (err){
      const code = (err && err.data && err.data.error) || (err && err.message) || '';
      const isRate = code==='RATE_LIMIT' || code==='LOCKED' || err.status===429;
      if (!isRate || attempt===3) throw err;
      updateSyncStatus('制限中のため ' + Math.round(delay/1000) + '秒後に再試行します…');
      await sleep(delay);
      delay *= 2;
    }
  }
  throw new Error('retry_exhausted');
}

/* _outbox をテーブルごとにまとめて push する。成功した分だけ outbox から消す。 */
async function syncPush(){
  const entries = (await idbAll('_outbox')).sort(function(a,b){ return a.createdAt-b.createdAt; });
  if (!entries.length) return {pushed:0, conflicts:[]};
  const byTable = {};
  entries.forEach(function(e){ (byTable[e.table] = byTable[e.table] || []).push(e); });
  const deviceId = await metaGet('deviceId');
  let pushed = 0;
  const conflicts = [];
  for (const table of Object.keys(byTable)){
    const list = byTable[table];
    const rows = [];
    const rowEntryIds = [];
    for (const e of list){
      if (e.op === 'delete'){
        // 論理削除の墓標行（isDeleted=true）。updatedAt には削除時刻を使う。
        const idField = SYNC_ID_FIELD[table];
        const row = {};
        row[idField] = (table==='venues') ? Number(e.rowId) : e.rowId;
        row.isDeleted = true;
        row.updatedAt = e.createdAt;
        rows.push(row);
        rowEntryIds.push(e.outboxId);
      } else {
        try {
          rows.push(JSON.parse(e.payload));
          rowEntryIds.push(e.outboxId);
        } catch (err){
          await idbRawDelete('_outbox', e.outboxId); // 壊れたエントリは捨てる
        }
      }
    }
    for (let i=0; i<rows.length; i+=SYNC_PUSH_CHUNK){
      const chunk = rows.slice(i, i+SYNC_PUSH_CHUNK);
      const chunkIds = rowEntryIds.slice(i, i+SYNC_PUSH_CHUNK);
      const body = {spreadsheetId: state.sync.spreadsheetId, deviceId: deviceId, rows: {}};
      body.rows[table] = chunk;
      let data;
      try {
        data = await syncCallWithRetry('push', body);
      } catch (err){
        for (const id of chunkIds){
          const en = await idbGet('_outbox', id);
          if (en){ en.tryCount = (en.tryCount||0)+1; en.lastError = String((err && err.message) || err); await idbRawPut('_outbox', en); }
        }
        throw err;
      }
      // サーバー側の処理上限で残りが出た場合は、続きをそのまま再送する。
      let remaining = data.remaining && data.remaining[table];
      let guard = 0;
      while (remaining && remaining.length && guard++ < 20){
        const body2 = {spreadsheetId: state.sync.spreadsheetId, deviceId: deviceId, rows: {}};
        body2.rows[table] = remaining;
        const d2 = await syncCallWithRetry('push', body2);
        if (d2.conflicts) conflicts.push.apply(conflicts, d2.conflicts);
        pushed += (d2.applied && d2.applied[table]) || 0;
        remaining = d2.remaining && d2.remaining[table];
      }
      if (data.conflicts) conflicts.push.apply(conflicts, data.conflicts);
      pushed += (data.applied && data.applied[table]) || 0;
      // 反映済み（競合でシート側が勝った行を含む）は outbox から消す。
      // 競合した行のローカル側は、このあとの pull でシートの内容に更新される。
      for (const id of chunkIds) await idbRawDelete('_outbox', id);
    }
  }
  return {pushed: pushed, conflicts: conflicts};
}

/* pull で受け取った行を、updatedAt 比較で IndexedDB へ取り込む。 */
function normalizePulledRow(table, srv){
  const row = Object.assign({}, srv);
  // JSON文字列の列が万一オブジェクトで来た場合は文字列化する。
  ['scoresJson','opponentMembersJson','customItemsJson','photoUrisJson','strongShotsJson','weakShotsJson','strongCoursesJson','weakCoursesJson'].forEach(function(k){
    if (row[k] !== undefined && row[k] !== null && typeof row[k] !== 'string') row[k] = JSON.stringify(row[k]);
  });
  if (table==='matches' && (row.scoresJson === undefined || row.scoresJson === null)) row.scoresJson = '[]';
  if (row.isDeleted === undefined || row.isDeleted === null) row.isDeleted = false;
  return row;
}

async function syncPull(){
  let offset = {};
  let inserted = 0, updated = 0, keptLocal = 0;
  for (let round=0; round<50; round++){
    const data = await syncCallWithRetry('pull', {spreadsheetId: state.sync.spreadsheetId, offset: offset, limit: SYNC_PULL_LIMIT});
    const rows = data.rows || {};
    for (const table of SYNC_TABLES){
      const list = rows[table] || [];
      for (const srv of list){
        const idField = SYNC_ID_FIELD[table];
        const id = srv[idField];
        if (id === undefined || id === null || id === '') continue;
        const local = await idbGet(table, id);
        if (!local){
          await idbRawPut(table, normalizePulledRow(table, srv));
          inserted++;
        } else if (SYNC_HAS_UPDATED_AT[table]){
          const sUp = Number(srv.updatedAt)||0, lUp = Number(local.updatedAt)||0;
          if (sUp > lUp){
            await idbRawPut(table, normalizePulledRow(table, srv));
            updated++;
          } else if (lUp > sUp){
            keptLocal++;
            // ローカルの方が新しいのに outbox に無ければ、次回 push できるよう積む。
            const pending = (await idbAll('_outbox')).some(function(e){ return e.table===table && String(e.rowId)===String(id); });
            if (!pending) await idbPut(table, local);
          }
        } else {
          // updatedAt が無いテーブル（張り替え履歴・対戦相手カスタム項目）はローカル優先。
          keptLocal++;
        }
      }
    }
    const hasMore = data.hasMore || {};
    const next = data.nextOffset || {};
    let more = false;
    offset = {};
    for (const table of SYNC_TABLES){
      if (hasMore[table]){ more = true; offset[table] = next[table] || 0; }
    }
    if (!more) break;
    if (round===49) throw new Error('pull_too_many_rounds');
  }
  return {inserted: inserted, updated: updated, keptLocal: keptLocal, serverTime: Date.now()};
}

/* 同期の現在状態を #sync-status へ描く（入力欄には触らない）。 */
function syncStatusHTML(){

  h += '<div class="kv"><span>'+esc(t('sync_last'))+'</span><b>'+(s.lastSyncAt?esc(fmtDateTime(s.lastSyncAt)):'—')+'</b></div>';
  h += '<div class="kv"><span>'+esc(t('outbox_pending'))+'</span><b>'+state.outboxCount+'</b></div>';
  if (s.conflictCount>0) h += '<div class="kv"><span>'+esc(t('sync_conflicts'))+'</span><b>'+s.conflictCount+'</b></div>';
  if (s.lastError) h += '<div class="notice error" style="margin-top:8px">'+esc(s.lastError)+'</div>';

}
function updateSyncStatus(msg){
  if (msg !== undefined) state.sync.statusText = msg;
  const el = document.getElementById('sync-status');
  if (el) el.innerHTML = syncStatusHTML();
}

/* 同期中の進捗表示（段階＋経過秒）。#sync-status だけを更新し、入力欄には触らない。 */
let syncTickTimer = null;
function syncElapsedText(){
  const s = state.sync;
  const sec = s.startedAt ? Math.floor((Date.now() - s.startedAt)/1000) : 0;
  const phase = s.phase==='push' ? t('sync_phase_push')
    : s.phase==='pull' ? t('sync_phase_pull') : t('sync_syncing');
  return phase + (LANG==='ja' ? '（' + sec + '秒）' : ' (' + sec + 's)');
}
function syncTickStart(){
  syncTickStop();
  state.sync.startedAt = Date.now();
  updateSyncStatus(syncElapsedText());
  syncTickTimer = setInterval(function(){
    if (!state.sync.syncing){ syncTickStop(); return; }
    updateSyncStatus(syncElapsedText());
  }, 1000);
}
function syncTickStop(){
  if (syncTickTimer){ clearInterval(syncTickTimer); syncTickTimer = null; }
}

/* 同期1回分（push → pull）。auto時は失敗しても画面を再描画しない。 */
async function syncNow(opts){
  opts = opts || {};
  if (state.sync.syncing){ updateSyncStatus(state.sync.startedAt ? syncElapsedText() : t('sync_syncing')); return null; }
  if (!syncConfigured()){
    updateSyncStatus(t('sync_need_config'));
    return null;
  }
  state.sync.syncing = true;
  state.sync.phase = 'push';
  syncTickStart();
  let pushRes = {pushed:0, conflicts:[]};
  let pullRes = null;
  let pushErr = null, pullErr = null;
  try {
    if (navigator.onLine === false) throw new Error('offline');
    pushRes = await syncPush();
  } catch (err){ pushErr = err; }
  try {
    state.sync.phase = 'pull';
    updateSyncStatus(syncElapsedText());
    pullRes = await syncPull();
  } catch (err){ pullErr = err; }
  state.sync.syncing = false;
  syncTickStop();
  state.sync.phase = null;
  const conflicts = pushRes.conflicts || [];
  if (conflicts.length){
    state.sync.conflictCount = (state.sync.conflictCount||0) + conflicts.length;
    await metaSet('syncConflictCount', state.sync.conflictCount);
  }
  const firstErr = pushErr || pullErr;
  if (!firstErr || pullRes){
    // pull が成功した、または push が成功した場合は同期時刻を更新する。
    state.sync.lastSyncAt = pullRes ? (pullRes.serverTime || Date.now()) : Date.now();
    await metaSet('lastSyncAt', state.sync.lastSyncAt);
  }
  if (firstErr){
    const msg = firstErr.message==='offline' ? t('sync_offline')
      : firstErr.message==='timeout' ? t('sync_timeout')
      : firstErr.message==='network_error' ? t('sync_push_failed')
      : (firstErr.data && firstErr.data.message) ? String(firstErr.data.message)
      : t('sync_push_failed');
    state.sync.lastError = msg;
    await metaSet('syncLastError', msg);
    state.sync.statusText = '';
    updateSyncStatus();
    if (!opts.silent) proNotice(msg);
    await afterSyncRefresh(opts);
    return {ok:false, error:msg, pushed:pushRes.pushed, conflicts:conflicts};
  }
  state.sync.lastError = null;
  await metaSet('syncLastError', null);
  state.sync.statusText = t('sync_done')
    + (conflicts.length ? ' ' + t('sync_conflict_note') : '')
    + '（送信 ' + pushRes.pushed + '件 / 新規 ' + (pullRes?pullRes.inserted:0) + '件 / 更新 ' + (pullRes?pullRes.updated:0) + '件）';
  updateSyncStatus();
  if (!opts.silent && !opts.auto) toast(t('sync_done'));
  await afterSyncRefresh(opts);
  return {ok:true, pushed:pushRes.pushed, pull:pullRes, conflicts:conflicts};
}

/* 同期後の画面更新。自動同期では、同期設定の入力欄にフォーカスがある間は
   再描画しない（入力中の文字が消えるのを防ぐ）。 */
async function afterSyncRefresh(opts){
  if (opts.auto){
    const ae = document.activeElement;
    const typingSync = ae && (ae.id==='sync-bridge' || ae.id==='sync-sheet' || ae.id==='sync-secret');
    if (typingSync) return;
  }
  await loadAll();
  render();
  updateSyncStatus();
}

async function syncTestUI(){
  if (!await syncSaveSettingsUI(true)) return;
  updateSyncStatus(t('sync_syncing'));
  try {
    if (navigator.onLine === false) throw new Error('offline');
    const data = await syncCallWithRetry('init', {spreadsheetId: state.sync.spreadsheetId});
    state.sync.lastError = null;
    await metaSet('syncLastError', null);
    const made = (data.created||[]).join(', ') || '—';
    state.sync.statusText = t('sync_test_ok') + ' schemaVersion=' + data.schemaVersion + ' / 新規作成: ' + made;
    updateSyncStatus();
  } catch (err){
    const msg = err.message==='offline' ? t('sync_offline')
      : err.message==='timeout' ? t('sync_timeout')
      : (err.data && err.data.message) ? String(err.data.message)
      : t('sync_push_failed');
    state.sync.lastError = msg;
    await metaSet('syncLastError', msg);
    state.sync.statusText = '';
    updateSyncStatus();
  }
}

async function syncNowUI(){
  if (!await syncSaveSettingsUI(true)) return;
  await syncNow({});
}

async function syncRestoreUI(){
  if (!await syncSaveSettingsUI(true)) return;
  if (!confirm(t('sync_restore_confirm'))) return;
  const res = await syncNow({restore:true});
  if (res && res.ok){
    state.sync.statusText = t('sync_restored') + '（新規 ' + (res.pull?res.pull.inserted:0) + '件 / 更新 ' + (res.pull?res.pull.updated:0) + '件）';
    updateSyncStatus();
  }
}

const state = {
  tab:'home', view:'tab', // view: 'tab' | 'settings'
  currentPlayerId: localStorage.getItem('ss-player') || null,
  players:[], matches:[], gears:[], maintenances:[], focuses:[], notes:[],
  outboxCount:0, isPro:false, persisted:null, demo:false,
  sync:{bridgeUrl:'', spreadsheetUrl:'', spreadsheetId:'', secret:'', lastSyncAt:null, lastError:null, conflictCount:0, syncing:false, statusText:'', phase:null, startedAt:null},
  search:'', filter:'all',
  editingMatchId:null, editingGearId:null,
  draft:null, // 試合フォームの下書き（メモリ上のみ）
  pointSheet:null // {setIndex, points:[], server}
};

async function loadAll(){
  const p = await idbAll('players');
  state.players = p.filter(function(x){return !x.isDeleted;}).sort(function(a,b){return a.createdAt-b.createdAt;});
  state.matches = (await idbAll('matches')).filter(function(x){return !x.isDeleted;});
  state.gears = (await idbAll('gears')).filter(function(x){return !x.isDeleted;});
  state.maintenances = await idbAll('gear_maintenances');
  state.focuses = (await idbAll('focuses')).filter(function(x){return !x.isDeleted;});
  state.notes = (await idbAll('notes')).filter(function(x){return !x.isDeleted;});
  state.outboxCount = (await idbAll('_outbox')).length;
  state.isPro = (await metaGet('isPro'))===true;
  state.demo = (await metaGet('demo'))===true;
  // 同期設定（合言葉を含む。_meta は書き出し・同期の対象外）
  state.sync.bridgeUrl = (await metaGet('syncBridgeUrl'))||'';
  state.sync.spreadsheetUrl = (await metaGet('syncSpreadsheetUrl'))||'';
  state.sync.spreadsheetId = (await metaGet('syncSpreadsheetId'))||'';
  state.sync.secret = (await metaGet('syncSecret'))||'';
  state.sync.lastSyncAt = await metaGet('lastSyncAt');
  state.sync.lastError = await metaGet('syncLastError');
  state.sync.conflictCount = (await metaGet('syncConflictCount'))||0;
  if (!state.currentPlayerId || !state.players.some(function(x){return x.playerId===state.currentPlayerId;})){
    state.currentPlayerId = state.players.length?state.players[0].playerId:null;
    if (state.currentPlayerId) localStorage.setItem('ss-player', state.currentPlayerId);
  }
}
function currentPlayer(){
  return state.players.find(function(p){return p.playerId===state.currentPlayerId;})||null;
}
function playerMatches(pid){
  const id = pid||state.currentPlayerId;
  return state.matches.filter(function(m){return m.playerId===id;})
    .sort(function(a,b){return (b.matchDateEpochDay-a.matchDateEpochDay)||(b.createdAt-a.createdAt);});
}
function monthMatchCount(pid){
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth();
  return state.matches.filter(function(m){
    if(m.playerId!==pid) return false;
    const d=new Date(m.createdAt);
    return d.getFullYear()===y && d.getMonth()===mo;
  }).length;
}

function toast(msg){
  const view = $('#view');
  const d = document.createElement('div');
  d.className='notice info'; d.textContent = msg;
  view.prepend(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 3500);
}
function proNotice(msg){
  const view = $('#view');
  const d = document.createElement('div');
  d.className='notice'; d.textContent = msg;

function readSetsFromForm(){

    const get = function(f){ const el = row.querySelector('[data-f="'+f+'"]'); return el?el.value:''; };
    const num = function(f){ const v=get(f); return v===''||v==null?null:parseInt(v,10); };
    const s = state.draft.sets[parseInt(row.dataset.set,10)] || blankSet();
    return {
      myScore:num('myScore'), opponentScore:num('opponentScore'),
      tieBreakMy:num('tieBreakMy'), tieBreakOpponent:num('tieBreakOpponent'),
      specialResult:get('specialResult')||null,
      lostInitiativeScore:get('lostInitiativeScore')||null,
      gainedInitiativeScore:get('gainedInitiativeScore')||null,
      momentumDetail:get('momentumDetail')||null,
      pointSequence: s.pointSequence||null
    };
  });

async function saveMatch(){

    proNotice(t('free_limit_match')); return;
  }
  const now = Date.now();
  const prev = isNew?null:state.matches.find(function(m){return m.matchId===d.matchId;});
  const m = {
    matchId:d.matchId, playerId:d.playerId, sportType:d.sportType, matchType:$('#f-type').value,
    playerTeamNameSnapshot:(currentPlayer()||{}).defaultTeamName||null,
    partnerName:$('#f-partner').value.trim()||null,
    opponentDisplayName:opp,
    opponentMembersJson:JSON.stringify([opp]),
    opponentTeamNameSnapshot:d.opponentTeamNameSnapshot||null,
    courtSurface:$('#f-surface').value, environmentType:$('#f-env').value,
    gearId:d.gearId||null, tournamentName:$('#f-tournament').value.trim(),
    tournamentYear:parseInt($('#f-year').value,10)||new Date().getFullYear(),
    matchDateEpochDay:dateInputToEpochDay(dateVal),
    finalResultCode:'NORMAL', roundName:$('#f-round').value.trim()||null,
    tournamentDivision:d.tournamentDivision||null, tournamentFormat:d.tournamentFormat||null,
    scoresJson:JSON.stringify(d.sets), isWin:false,
    videoPathOrUrl:$('#f-video').value.trim()||null, matchNote:$('#f-note').value.trim()||null,
    photoPath:d.photoPath||null, isTeamMatch:$('#f-team').checked,
    teamMyScore:$('#f-team-my').value===''?null:parseInt($('#f-team-my').value,10),
    teamOpponentScore:$('#f-team-op').value===''?null:parseInt($('#f-team-op').value,10),
    weatherType:d.weatherType||null, ballOrShuttle:$('#f-ball').value.trim()||null,
    isNightMatch:d.isNightMatch||false, venueId:d.venueId||null,

    cumulativeMatchesFromMaintenance:prev?prev.cumulativeMatchesFromMaintenance:null,

  };

async function deleteMatch(){

  if (m){ m.isDeleted=true; m.deletedAt=Date.now(); m.updatedAt=Date.now(); await idbPut('matches', m); }
  await loadAll();
  state.editingMatchId=null; state.draft=null;

function pointApply(){
  const ps = state.pointSheet;
  const sport = state.draft.sportType;
  const prog = calcGameProgress(sport, 'A', ps.points);
  const s = state.draft.sets[ps.setIndex];
  s.pointSequence = ps.points.slice();
  if (sport==='TENNIS' || sport==='SOFT_TENNIS'){
    s.myScore = prog.tennisGamesScoreA; s.opponentScore = prog.tennisGamesScoreB;
    if (prog.isTennisTiebreak){ s.tieBreakMy=prog.tieBreakScoreA; s.tieBreakOpponent=prog.tieBreakScoreB; }

    s.myScore = prog.scoreA; s.opponentScore = prog.scoreB;

/* ---- 分析（最小限） ---- */
function analyticsHTML(){
  const p = currentPlayer();
  if (!p) return '<div class="card"><p>'+esc(t('no_player'))+'</p></div>';
  const ms = playerMatches();
  const wins = ms.filter(function(m){return m.isWin;}).length;
  let h = '<div class="card"><h2>'+esc(p.playerName)+'</h2><div class="stat-grid">'
    + '<div class="stat"><div class="num">'+ms.length+'</div><div class="lbl">'+esc(t('total_matches'))+'</div></div>'
    + '<div class="stat"><div class="num">'+wins+'</div><div class="lbl">'+esc(t('wins'))+'</div></div>'
    + '<div class="stat"><div class="num">'+(ms.length?Math.round(wins/ms.length*100):0)+'%</div><div class="lbl">'+esc(t('win_rate'))+'</div></div></div></div>';
  // 月別勝率（直近6か月）
  const byMonth = {};
  ms.forEach(function(m){
    const d = epochDayToDate(m.matchDateEpochDay);
    const key = d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');
    byMonth[key]=byMonth[key]||{total:0,wins:0};
    byMonth[key].total++; if(m.isWin) byMonth[key].wins++;
  });
  const months = Object.keys(byMonth).sort().slice(-6);
  h += '<div class="card"><h2>'+esc(t('monthly_win_rate'))+'</h2>';
  if (!months.length) h += '<p class="muted">'+esc(t('no_matches'))+'</p>';
  months.forEach(function(k){
    const v=byMonth[k], rate=v.total?Math.round(v.wins/v.total*100):0;
    h += '<div class="bar-row"><span class="bar-label">'+esc(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+rate+'%"></div></div><span class="bar-val">'+rate+'% ('+v.wins+'/'+v.total+')</span></div>';
  });
  h += '</div>';
  // サーフェス別勝率
  const bySurf = {};
  ms.forEach(function(m){
    const s=m.courtSurface||'UNKNOWN';
    bySurf[s]=bySurf[s]||{total:0,wins:0};
    bySurf[s].total++; if(m.isWin) bySurf[s].wins++;
  });
  h += '<div class="card"><h2>'+esc(t('surface_win_rate'))+'</h2>';
  const surfs = Object.keys(bySurf).sort();
  if (!surfs.length) h += '<p class="muted">'+esc(t('no_matches'))+'</p>';
  surfs.forEach(function(k){
    const v=bySurf[k], rate=v.total?Math.round(v.wins/v.total*100):0;
    h += '<div class="bar-row"><span class="bar-label">'+esc(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+rate+'%"></div></div><span class="bar-val">'+rate+'% ('+v.wins+'/'+v.total+')</span></div>';
  });
  h += '</div>';
  return h;
}

/* ---- JSON書き出し・取り込み（Android版と同じキー名） ---- */
async function exportJSON(){
  const data = {
    players: await idbAll('players'),
    gears: await idbAll('gears'),
    matches: await idbAll('matches'),
    maintenances: await idbAll('gear_maintenances'),
    venues: await idbAll('venues'),
    opponentProfiles: await idbAll('opponent_profiles'),
    opponentCustomItems: await idbAll('opponent_custom_items'),
    focuses: await idbAll('focuses'),
    notes: await idbAll('notes')
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = 'smashstats_backup_' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(t('export_done'));
}
async function importJSONFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const map = {players:'players', gears:'gears', matches:'matches', maintenances:'gear_maintenances',
      venues:'venues', opponentProfiles:'opponent_profiles', opponentCustomItems:'opponent_custom_items',
      focuses:'focuses', notes:'notes'};
    for (const k of Object.keys(map)){
      const arr = data[k];
      if (!Array.isArray(arr)) continue;
      for (const row of arr){
        if (k==='matches') deriveMatch(row);
        await idbPut(map[k], row);
      }
    }
    await loadAll(); toast(t('imported')); render();
  }catch(e){ proNotice(t('import_error')); }
}

  for (const m of DEMO.matches){ deriveMatch(m); await idbPut('matches', m); }

/* ---------------- 起動 ---------------- */
function bindGlobal(){
  $all('#tabbar button').forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.dataset.tab); });
  });
  $('#btn-settings').addEventListener('click', function(){ state.view='settings'; render(); });
  const sel = $('#player-select');
  sel.addEventListener('change', function(){
    if (sel.value==='__add__'){ showPlayerForm(); renderPlayerSelect(); return; }
    state.currentPlayerId = sel.value;
    localStorage.setItem('ss-player', sel.value);
    render();
  });
  document.addEventListener('click', function(e){
    if (e.target && e.target.id==='import-file') return;
    const f = $('#import-file');
    if (f) f.onchange = function(){ if(f.files && f.files[0]) importJSONFile(f.files[0]); f.value=''; };
  });
  // キーボード表示時は下部タブを隠す（入力欄にフォーカスしている間だけ）
  document.addEventListener('focusin', function(e){
    const tag = (e.target.tagName||'').toLowerCase();
    if (tag==='input' || tag==='textarea' || tag==='select') document.body.classList.add('kb');
  });
  document.addEventListener('focusout', function(){
    setTimeout(function(){ document.body.classList.remove('kb'); }, 150);
  });
  document.addEventListener('click', function(e){
    if (e.target && e.target.id==='overlay' ) closeOverlay();
  });
}
async function init(){
  bindGlobal();
  try{
    if (navigator.storage && navigator.storage.persist){
      state.persisted = await navigator.storage.persist();
    }
  }catch(e){ state.persisted = null; }
  await loadAll();
  await metaSet('schemaVersion', 16);
  if (!await metaGet('deviceId')) await metaSet('deviceId', uuid());
  render();
  // 起動時の自動同期（設定済み・オンラインのときだけ。失敗しても黙って残す）。
  if (syncConfigured() && navigator.onLine !== false){
    syncNow({auto:true, silent:true}).catch(function(){ /* 状態は設定画面に残る */ });
  }
  if ('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* オフライン時は無視 */ });
  }
}
document.addEventListener('DOMContentLoaded', init);
